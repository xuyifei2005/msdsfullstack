<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>急救措施数据直接测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .result {
            background-color: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
        }
        .success {
            background-color: #e8f5e8;
            color: #2e7d32;
        }
        button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #1565c0;
        }
        .info {
            background-color: #e3f2fd;
            color: #1565c0;
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>急救措施数据直接测试</h1>
    
    <div class="info">
        <strong>测试说明：</strong>这个页面将直接测试急救措施API，不依赖前端框架，帮助定位问题。
    </div>

    <div class="test-section">
        <h2>测试1: 直接调用急救措施API</h2>
        <p>API: GET /api/system/msds/firstaid/msds/157</p>
        <button onclick="testFirstAidAPI()">测试急救措施API</button>
        <div id="result1" class="result"></div>
    </div>

    <div class="test-section">
        <h2>测试2: 模拟前端请求（带认证头）</h2>
        <p>模拟前端发送的请求，包含可能的认证信息</p>
        <button onclick="testFirstAidWithAuth()">测试带认证的请求</button>
        <div id="result2" class="result"></div>
    </div>

    <div class="test-section">
        <h2>测试3: 检查数据库数据</h2>
        <p>通过后端API检查数据库中是否存在急救措施数据</p>
        <button onclick="checkDatabaseData()">检查数据库数据</button>
        <div id="result3" class="result"></div>
    </div>

    <div class="test-section">
        <h2>测试4: 检查后端服务状态</h2>
        <p>检查后端服务是否正常运行</p>
        <button onclick="checkBackendStatus()">检查后端状态</button>
        <div id="result4" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:18080';
        
        async function testFirstAidAPI() {
            const resultDiv = document.getElementById('result1');
            resultDiv.textContent = '正在测试...';
            
            try {
                const response = await fetch(`${API_BASE}/api/system/msds/firstaid/msds/157`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ 成功获取急救措施数据:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 请求失败: ${response.status} ${response.statusText}\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 网络错误: ${error.message}`;
            }
        }
        
        async function testFirstAidWithAuth() {
            const resultDiv = document.getElementById('result2');
            resultDiv.textContent = '正在测试...';
            
            try {
                // 尝试从localStorage获取token
                const token = localStorage.getItem('token') || localStorage.getItem('access_token') || 'test-token';
                
                const response = await fetch(`${API_BASE}/api/system/msds/firstaid/msds/157`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ 带认证请求成功:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 带认证请求失败: ${response.status} ${response.statusText}\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 网络错误: ${error.message}`;
            }
        }
        
        async function checkDatabaseData() {
            const resultDiv = document.getElementById('result3');
            resultDiv.textContent = '正在检查数据库...';
            
            try {
                // 尝试通过其他API检查数据
                const response = await fetch(`${API_BASE}/api/system/msds/firstaid/list`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ 数据库检查成功:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 数据库检查失败: ${response.status} ${response.statusText}\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 网络错误: ${error.message}`;
            }
        }
        
        async function checkBackendStatus() {
            const resultDiv = document.getElementById('result4');
            resultDiv.textContent = '正在检查后端状态...';
            
            try {
                const response = await fetch(`${API_BASE}/api/system/msds/firstaid/list`);
                
                if (response.status === 401) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ 后端服务正常运行 (401认证错误是正常的)\n状态码: ${response.status}\n说明: 后端服务已启动，但需要认证`;
                } else if (response.status === 200) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ 后端服务正常运行\n状态码: ${response.status}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 后端服务异常\n状态码: ${response.status}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 无法连接到后端服务: ${error.message}`;
            }
        }
    </script>
</body>
</html>
