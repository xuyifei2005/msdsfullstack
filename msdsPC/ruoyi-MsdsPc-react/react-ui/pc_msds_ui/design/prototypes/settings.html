<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS 管理系统 - 系统设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <h1 class="text-2xl font-bold text-gray-900">系统设置</h1>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 左侧设置导航 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">设置分类</h3>
                    <nav class="space-y-2">
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 text-blue-600 bg-blue-50 rounded-lg">
                            <i class="fas fa-cog w-5"></i>
                            <span>基本设置</span>
                        </a>
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg">
                            <i class="fas fa-shield-alt w-5"></i>
                            <span>安全设置</span>
                        </a>
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg">
                            <i class="fas fa-database w-5"></i>
                            <span>数据管理</span>
                        </a>
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg">
                            <i class="fas fa-envelope w-5"></i>
                            <span>通知设置</span>
                        </a>
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg">
                            <i class="fas fa-chart-bar w-5"></i>
                            <span>系统监控</span>
                        </a>
                    </nav>
                </div>
            </div>

            <!-- 右侧设置内容 -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 基本设置 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">基本设置</h3>
                    <div class="space-y-6">
                        <!-- 系统信息 -->
                        <div>
                            <h4 class="text-md font-medium text-gray-900 mb-4">系统信息</h4>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">系统名称</label>
                                    <input type="text" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="MSDS 管理文件系统">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">系统版本</label>
                                    <input type="text" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50"
                                           value="v1.0.0" readonly>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">机构名称</label>
                                    <input type="text" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="XX大学化学实验室">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">系统语言</label>
                                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                        <option>中文简体</option>
                                        <option>English</option>
                                        <option>中文繁体</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 文件设置 -->
                        <div class="border-t pt-6">
                            <h4 class="text-md font-medium text-gray-900 mb-4">文件设置</h4>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">最大文件大小 (MB)</label>
                                    <input type="number" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="50">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">允许的文件格式</label>
                                    <input type="text" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="PDF, DOC, DOCX, TXT">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">存储路径</label>
                                    <div class="flex">
                                        <input type="text" 
                                               class="flex-1 px-3 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500"
                                               value="/data/msds/">
                                        <button class="px-4 py-2 bg-gray-200 border border-l-0 border-gray-300 rounded-r-lg hover:bg-gray-300">
                                            <i class="fas fa-folder-open"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">自动备份间隔</label>
                                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                        <option>每日</option>
                                        <option>每周</option>
                                        <option>每月</option>
                                        <option>手动</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 安全设置 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">安全设置</h3>
                    <div class="space-y-6">
                        <!-- 密码策略 -->
                        <div>
                            <h4 class="text-md font-medium text-gray-900 mb-4">密码策略</h4>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">最小密码长度</p>
                                        <p class="text-xs text-gray-600">设置用户密码的最小长度要求</p>
                                    </div>
                                    <input type="number" 
                                           class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="8" min="6" max="20">
                                </div>
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">密码复杂度要求</p>
                                        <p class="text-xs text-gray-600">要求密码包含字母、数字和特殊字符</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" class="sr-only peer" checked>
                                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                                    </label>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">密码过期时间 (天)</p>
                                        <p class="text-xs text-gray-600">密码自动过期的天数，0表示永不过期</p>
                                    </div>
                                    <input type="number" 
                                           class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="90" min="0">
                                </div>
                            </div>
                        </div>

                        <!-- 登录安全 -->
                        <div class="border-t pt-6">
                            <h4 class="text-md font-medium text-gray-900 mb-4">登录安全</h4>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">登录失败锁定</p>
                                        <p class="text-xs text-gray-600">连续登录失败后锁定账户</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" class="sr-only peer" checked>
                                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                                    </label>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">最大失败次数</p>
                                        <p class="text-xs text-gray-600">账户锁定前允许的最大失败次数</p>
                                    </div>
                                    <input type="number" 
                                           class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="5" min="3" max="10">
                                </div>
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">会话超时 (分钟)</p>
                                        <p class="text-xs text-gray-600">用户无操作后自动登出的时间</p>
                                    </div>
                                    <input type="number" 
                                           class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="30" min="5">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 数据管理 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">数据管理</h3>
                    <div class="space-y-6">
                        <!-- 备份设置 -->
                        <div>
                            <h4 class="text-md font-medium text-gray-900 mb-4">数据备份</h4>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">备份类型</label>
                                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                        <option>完整备份</option>
                                        <option>增量备份</option>
                                        <option>差异备份</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">备份保留期 (天)</label>
                                    <input type="number" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="30" min="7">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">备份路径</label>
                                    <div class="flex">
                                        <input type="text" 
                                               class="flex-1 px-3 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500"
                                               value="/backup/msds/">
                                        <button class="px-4 py-2 bg-gray-200 border border-l-0 border-gray-300 rounded-r-lg hover:bg-gray-300">
                                            <i class="fas fa-folder-open"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">下次备份时间</label>
                                    <input type="datetime-local" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           value="2024-01-16T02:00">
                                </div>
                            </div>
                            <div class="mt-4 flex space-x-3">
                                <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                    <i class="fas fa-save mr-2"></i>立即备份
                                </button>
                                <button class="px-4 py-2 text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50">
                                    <i class="fas fa-upload mr-2"></i>恢复备份
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 保存按钮 -->
                <div class="flex justify-end space-x-3">
                    <button class="px-6 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
                        取消
                    </button>
                    <button class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-check mr-2"></i>保存设置
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
