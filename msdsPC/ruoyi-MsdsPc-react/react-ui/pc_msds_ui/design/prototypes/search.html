<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS 管理系统 - 搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900">MSDS 搜索</h1>
                <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-plus mr-2"></i>添加MSDS
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 左侧搜索筛选 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">搜索条件</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">关键词</label>
                            <input type="text" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                   placeholder="化学品名称、CAS号..."
                                   value="丙酮">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">供应商</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option>全部供应商</option>
                                <option>国药试剂</option>
                                <option>西格玛-奥德里奇</option>
                            </select>
                        </div>
                        <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                            <i class="fas fa-search mr-2"></i>搜索
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧搜索结果 -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900">搜索结果</h3>
                            <p class="text-sm text-gray-600">找到 <span class="font-medium text-blue-600">23</span> 个匹配的MSDS文档</p>
                        </div>
                        <select class="px-3 py-1 border border-gray-300 rounded text-sm">
                            <option>按相关性排序</option>
                            <option>按更新时间排序</option>
                        </select>
                    </div>
                </div>

                <!-- 搜索结果列表 -->
                <div class="space-y-4">
                    <!-- 结果项1 -->
                    <div class="bg-white rounded-lg shadow-sm p-6 hover:shadow-md transition-shadow">
                        <div class="flex">
                            <i class="fas fa-file-pdf text-red-500 text-2xl mr-4 mt-1"></i>
                            <div class="flex-1">
                                <h4 class="text-lg font-semibold text-gray-900 mb-2">
                                    <span class="bg-yellow-200">丙酮</span> - 化学品安全技术说明书
                                </h4>
                                <div class="grid grid-cols-2 gap-4 mb-3 text-sm text-gray-600">
                                    <div>CAS号: <span class="font-medium">67-64-1</span></div>
                                    <div>供应商: <span class="font-medium">国药试剂</span></div>
                                    <div>更新时间: <span class="font-medium">2024-01-10</span></div>
                                    <div>查阅次数: <span class="font-medium">156</span></div>
                                </div>
                                <div class="flex items-center space-x-2 mb-3">
                                    <span class="text-xs bg-red-100 text-red-800 px-2 py-1 rounded">易燃液体</span>
                                    <span class="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded">刺激性</span>
                                    <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">最新版本</span>
                                </div>
                                <div class="flex space-x-2">
                                    <button class="px-4 py-2 text-blue-600 border border-blue-600 rounded hover:bg-blue-50">
                                        <i class="fas fa-eye mr-1"></i>预览
                                    </button>
                                    <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                        <i class="fas fa-download mr-1"></i>下载
                                    </button>
                                    <button class="px-4 py-2 text-gray-600 hover:text-yellow-500">
                                        <i class="fas fa-star"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 结果项2 -->
                    <div class="bg-white rounded-lg shadow-sm p-6 hover:shadow-md transition-shadow">
                        <div class="flex">
                            <i class="fas fa-file-pdf text-red-500 text-2xl mr-4 mt-1"></i>
                            <div class="flex-1">
                                <h4 class="text-lg font-semibold text-gray-900 mb-2">
                                    异<span class="bg-yellow-200">丙酮</span> - 化学品安全技术说明书
                                </h4>
                                <div class="grid grid-cols-2 gap-4 mb-3 text-sm text-gray-600">
                                    <div>CAS号: <span class="font-medium">78-93-3</span></div>
                                    <div>供应商: <span class="font-medium">西格玛-奥德里奇</span></div>
                                    <div>更新时间: <span class="font-medium">2024-01-08</span></div>
                                    <div>查阅次数: <span class="font-medium">89</span></div>
                                </div>
                                <div class="flex items-center space-x-2 mb-3">
                                    <span class="text-xs bg-red-100 text-red-800 px-2 py-1 rounded">易燃液体</span>
                                    <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">最新版本</span>
                                </div>
                                <div class="flex space-x-2">
                                    <button class="px-4 py-2 text-blue-600 border border-blue-600 rounded hover:bg-blue-50">
                                        <i class="fas fa-eye mr-1"></i>预览
                                    </button>
                                    <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                        <i class="fas fa-download mr-1"></i>下载
                                    </button>
                                    <button class="px-4 py-2 text-yellow-500">
                                        <i class="fas fa-star"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 分页 -->
                <div class="bg-white rounded-lg shadow-sm p-6 mt-6">
                    <div class="flex items-center justify-between">
                        <div class="text-sm text-gray-600">显示 1-10 条，共 23 条结果</div>
                        <div class="flex space-x-2">
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600" disabled>上一页</button>
                            <button class="px-3 py-2 bg-blue-600 text-white rounded">1</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600">2</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
