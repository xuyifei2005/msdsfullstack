name: Security Check

on:
  # 每周一早上8点自动运行
  schedule:
    - cron: '0 8 * * 1'
  
  # 手动触发
  workflow_dispatch:
  
  # PR时运行
  pull_request:
    branches: [main, master, develop]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security check
        run: |
          node scripts/security-check.js
        continue-on-error: true
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: logs/
          retention-days: 30
      
      - name: Comment PR with security status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const reportPath = 'logs/security-report.json';
              if (fs.existsSync(reportPath)) {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                const vulns = report.metadata?.vulnerabilities || {};
                
                const total = (vulns.critical || 0) + (vulns.high || 0) + 
                             (vulns.moderate || 0) + (vulns.low || 0);
                
                const comment = `## 🔍 安全审计报告
                
                **漏洞统计:**
                - 🔴 严重: ${vulns.critical || 0}
                - 🟠 高危: ${vulns.high || 0}
                - 🟡 中危: ${vulns.moderate || 0}
                - 🔵 低危: ${vulns.low || 0}
                
                **总计:** ${total} 个漏洞
                
                ${total > 0 ? '⚠️ 建议在合并前修复安全漏洞' : '✅ 没有发现安全漏洞'}`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('无法读取安全报告文件');
            }