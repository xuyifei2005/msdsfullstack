# 项目相关配置
ruoyi:
  # 名称
  name: MSDS管理系统
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2025
  # 文件路径
  profile: /app/uploadPath
  # 获取ip地址开关
  addressEnabled: true
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
    # 配置域名访问
    remote-ip-header: X-Real-IP
    protocol-header: X-Forwarded-Proto
    protocol-header-https-value: https

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn
  file:
    path: /app/logs

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid-prod
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  data:
    # redis 配置 - 生产环境
    redis:
      # 地址
      host: msdsredis
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: FlyMsds2025Redis!@#
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms