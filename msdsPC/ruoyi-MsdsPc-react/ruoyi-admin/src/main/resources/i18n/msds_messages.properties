# MSDS业务错误消息 - 中文版
# 错误码格式：MSDS + 模块代码(2位) + 错误序号(3位)

# ========== MSDS主信息模块 (01) ==========
MSDS01001=MSDS记录不存在
MSDS01002=MSDS记录已存在
MSDS01003=产品名称不能为空
MSDS01004=CAS号格式不正确，正确格式为：数字-数字-数字
MSDS01005=MSDS状态无效，有效状态为：草稿、审核中、已发布、已过期
MSDS01006=MSDS删除失败，存在关联数据
MSDS01007=MSDS更新失败，请检查数据完整性
MSDS01008=MSDS创建失败，请检查必填字段

# ========== 文件导入模块 (02) ==========
MSDS02001=文件上传失败，请检查网络连接
MSDS02002=不支持的文件格式，支持的格式：.xlsx, .xls, .docx, .doc, .txt
MSDS02003=文件大小超出限制，最大允许{0}MB
MSDS02004=文件内容格式错误，请检查文件结构
MSDS02005=文件解析失败：{0}
MSDS02006=文件编码错误，请使用UTF-8编码
MSDS02007=Excel模板格式错误，请下载最新模板
MSDS02008=Word文档解析失败：{0}
MSDS02009=TXT文件解析失败，请检查文件格式

# ========== 数据验证模块 (03) ==========
MSDS03001=数据验证失败：{0}
MSDS03002=必填字段缺失：{0}
MSDS03003=字段长度超出限制，{0}字段最大长度为{1}个字符
MSDS03004=字段格式不正确：{0}
MSDS03005=枚举值无效，{0}的有效值为：{1}
MSDS03006=日期格式不正确，正确格式为：yyyy-MM-dd
MSDS03007=数字格式不正确：{0}

