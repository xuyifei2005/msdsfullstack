# MSDS Business Error Messages - English Version
# Error Code Format: MSDS + Module Code(2 digits) + Error Number(3 digits)

# ========== MSDS Main Information Module (01) ==========
MSDS01001=MSDS record not found
MSDS01002=MSDS record already exists
MSDS01003=Product name cannot be empty
MSDS01004=Invalid CAS number format, correct format: number-number-number
MSDS01005=Invalid MSDS status, valid statuses: Draft, Under Review, Published, Expired
MSDS01006=Failed to delete MSDS, related data exists
MSDS01007=Failed to update MSDS, please check data integrity
MSDS01008=Failed to create MSDS, please check required fields

# ========== File Import Module (02) ==========
MSDS02001=File upload failed, please check network connection
MSDS02002=Unsupported file format, supported formats: .xlsx, .xls, .docx, .doc, .txt
MSDS02003=File size exceeds limit, maximum allowed {0}MB
MSDS02004=File content format error, please check file structure
MSDS02005=File parsing failed: {0}
MSDS02006=File encoding error, please use UTF-8 encoding
MSDS02007=Excel template format error, please download the latest template
MSDS02008=Word document parsing failed: {0}
MSDS02009=TXT file parsing failed, please check file format

# ========== Data Validation Module (03) ==========
MSDS03001=Data validation failed: {0}
MSDS03002=Required field missing: {0}
MSDS03003=Field length exceeds limit, {0} field maximum length is {1} characters
MSDS03004=Field format incorrect: {0}
MSDS03005=Invalid enum value, valid values for {0} are: {1}
MSDS03006=Date format incorrect, correct format: yyyy-MM-dd
MSDS03007=Number format incorrect: {0}

# ========== Access Control Module (04) ==========
MSDS04001=Access denied, you do not have permission to access this resource
MSDS04002=Insufficient permissions, please contact administrator for appropriate permissions
MSDS04003=User unauthorized, please login to the system first
MSDS04004=Role permissions insufficient, current role cannot perform this operation

# ========== Business Logic Module (05) ==========
MSDS05001=Business rule violation: {0}
MSDS05002=Duplicate entry, {0} already exists
MSDS05003=Reference constraint exists, cannot delete referenced data
MSDS05004=Workflow status error, current status does not allow this operation
MSDS05005=Audit log recording failed

# ========== System Error Module (06) ==========
MSDS06001=Database operation failed, please try again later
MSDS06002=Network connection failed, please check network settings
MSDS06003=System busy, please try again later
MSDS06004=System configuration error, please contact administrator
MSDS06005=Cache operation failed

# ========== Import Progress Module (07) ==========
MSDS07001=Import task not found: {0}
MSDS07002=Import task already running
MSDS07003=Import task failed: {0}
MSDS07004=Import task cancelled: {0}
MSDS07005=Import task timeout: {0}
MSDS07006=Import template invalid: {0}
MSDS07007=Import data validation failed: {0}
MSDS07008=Import progress query failed: {0}
MSDS07009=User has active import task, please wait for completion
MSDS07010=Import task creation failed: {0}

# ========== Template Management Module (08) ==========
MSDS08001=Template not found, please check template name
MSDS08002=Template generation failed: {0}
MSDS08003=Template download failed, please try again later
MSDS08004=Template cache expired, regenerating
MSDS08005=Invalid template scope: {0}
MSDS08006=Template cache error: {0}

# ========== Data Export Module (09) ==========
MSDS09001=Data export failed: {0}
MSDS09002=Unsupported export format, supported formats: Excel, PDF, Word
MSDS09003=Export data is empty, please check query conditions
MSDS09004=Export permission insufficient, please contact administrator

# ========== Search Query Module (10) ==========
MSDS10001=Search failed: {0}
MSDS10002=Invalid search criteria, please check input parameters
MSDS10003=Too many search results (over {0} records), please narrow search scope

# ========== General Error (99) ==========
MSDS99001=Unknown error occurred, please contact technical support
MSDS99002=Parameter error: {0}
MSDS99003=Operation failed: {0}
MSDS99004=Service unavailable, please try again later

