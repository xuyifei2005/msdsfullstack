version: '3.8'

services:
  # PostgreSQL 主数据库
  postgres:
    image: postgres:14-alpine
    container_name: msds-postgres-dev
    environment:
      POSTGRES_DB: msds_dev
      POSTGRES_USER: msds_user
      POSTGRES_PASSWORD: msds_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - msds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msds_user -d msds_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: msds-elasticsearch-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=msds-cluster
      - node.name=msds-node-1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - msds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: msds-redis-dev
    command: redis-server --appendonly yes --requirepass msds_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - msds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO 对象存储 (替代文件系统存储)
  minio:
    image: minio/minio:latest
    container_name: msds-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: msds_minio_user
      MINIO_ROOT_PASSWORD: msds_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - msds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Kibana (可选 - 用于Elasticsearch数据可视化)
  kibana:
    image: kibana:8.11.0
    container_name: msds-kibana-dev
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: msds-kibana
    ports:
      - "5601:5601"
    networks:
      - msds-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  msds-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 