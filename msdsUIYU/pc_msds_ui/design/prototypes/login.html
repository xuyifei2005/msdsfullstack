<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS 管理系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .window-frame {
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-gray-800 to-slate-900 flex items-center justify-center p-4">
    <!-- PC端应用程序窗口模拟 -->
    <div class="window-frame w-full max-w-4xl h-[600px] relative">
        <!-- 窗口标题栏 -->
        <div class="flex items-center justify-between p-4 text-white">
            <div class="flex items-center space-x-3">
                <i class="fas fa-flask text-xl"></i>
                <span class="font-semibold">MSDS 管理文件系统</span>
                <span class="text-xs bg-white/20 px-2 py-1 rounded">v1.0</span>
            </div>
            <div class="flex space-x-2">
                <button class="w-3 h-3 bg-yellow-400 rounded-full"></button>
                <button class="w-3 h-3 bg-green-400 rounded-full"></button>
                <button class="w-3 h-3 bg-red-400 rounded-full"></button>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="h-[calc(100%-60px)] flex">
            <!-- 左侧背景图区域 -->
            <div class="flex-1 p-8 flex flex-col justify-center">
                <div class="text-white space-y-6">
                    <div class="space-y-3">
                        <h1 class="text-4xl font-bold">化学品安全</h1>
                        <h2 class="text-3xl font-light">技术说明书管理</h2>
                    </div>
                    <div class="space-y-4 text-lg text-gray-300">
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-shield-alt text-green-400"></i>
                            <span>安全合规管理</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-search text-blue-400"></i>
                            <span>快速智能检索</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-cloud-upload-alt text-purple-400"></i>
                            <span>便捷文档管理</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-users text-yellow-400"></i>
                            <span>团队协作支持</span>
                        </div>
                    </div>
                    <div class="text-sm text-gray-400 mt-8">
                        专为实验室科研机构设计的专业化学品安全管理平台
                    </div>
                </div>
            </div>

            <!-- 右侧登录表单区域 -->
            <div class="w-96 glass-effect p-8 rounded-r-lg">
                <div class="h-full flex flex-col justify-center">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-user text-white text-2xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900">用户登录</h3>
                        <p class="text-gray-600 mt-2">请输入您的账户信息</p>
                    </div>

                    <form class="space-y-6">
                        <!-- 用户名输入 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-user mr-2 text-gray-500"></i>
                                用户名
                            </label>
                            <input type="text" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                                   placeholder="请输入用户名"
                                   value="lab_admin">
                        </div>

                        <!-- 密码输入 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-lock mr-2 text-gray-500"></i>
                                密码
                            </label>
                            <div class="relative">
                                <input type="password" 
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 pr-12"
                                       placeholder="请输入密码"
                                       value="••••••••">
                                <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 记住我选项 -->
                        <div class="flex items-center justify-between">
                            <label class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                <span class="ml-2 text-sm text-gray-600">记住我</span>
                            </label>
                            <a href="#" class="text-sm text-blue-600 hover:text-blue-800">忘记密码？</a>
                        </div>

                        <!-- 登录按钮 -->
                        <button type="submit" 
                                class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition duration-200 transform hover:scale-[1.02]">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            登录系统
                        </button>

                        <!-- 分隔线 -->
                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-2 bg-white text-gray-500">或</span>
                            </div>
                        </div>

                        <!-- 其他登录选项 -->
                        <div class="space-y-3">
                            <button type="button" 
                                    class="w-full border border-gray-300 py-2.5 rounded-lg font-medium text-gray-700 hover:bg-gray-50 focus:ring-2 focus:ring-gray-200 transition duration-200">
                                <i class="fas fa-building mr-2 text-gray-500"></i>
                                企业域账户登录
                            </button>
                        </div>
                    </form>

                    <!-- 底部信息 -->
                    <div class="mt-8 text-center text-xs text-gray-500">
                        <p>© 2024 MSDS 管理文件系统</p>
                        <p class="mt-1">Version 1.0.0 | 技术支持</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 状态指示器 -->
    <div class="fixed bottom-4 right-4 flex items-center space-x-2 bg-white/90 backdrop-blur-sm px-3 py-2 rounded-full shadow-lg">
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        <span class="text-xs text-gray-600">系统状态：正常</span>
    </div>
</body>
</html>
