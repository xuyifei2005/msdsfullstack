<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS管理 - 分享</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .share-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .share-option {
            transition: all 0.2s ease;
        }
        .share-option:hover {
            transform: translateY(-2px);
        }
        .qr-code {
            background: #f9fafb;
            border: 2px dashed #d1d5db;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 微信小程序状态栏 -->
    <div class="bg-black text-white text-xs px-4 py-1 flex justify-between items-center">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-three-quarters text-xs"></i>
        </div>
    </div>
    
    <!-- 导航栏 -->
    <div class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-100">
        <div class="flex items-center">
            <i class="fas fa-arrow-left text-gray-600 mr-4 text-lg"></i>
            <span class="text-lg font-medium text-gray-800">分享MSDS</span>
        </div>
        <i class="fas fa-ellipsis-h text-gray-400"></i>
    </div>
    
    <!-- 主要内容区域 -->
    <div class="px-4 py-6 pb-20">
        
        <!-- 分享的MSDS信息卡片 -->
        <div class="share-card p-4 mb-6">
            <div class="flex items-center mb-4">
                <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=60&h=60&fit=crop&crop=center" 
                     alt="乙醇" class="w-15 h-15 rounded-xl object-cover mr-4">
                <!-- 图片来源: https://images.unsplash.com/photo-1532187863486-abf9dbad1b69 -->
                <div class="flex-1">
                    <h2 class="text-lg font-bold text-gray-800 mb-1">乙醇 (Ethanol)</h2>
                    <p class="text-sm text-gray-500 mb-2">CAS: 64-17-5 | 分子式: C₂H₆O</p>
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-1 bg-orange-100 text-orange-800 text-xs rounded-full">易燃液体</span>
                        <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full">中等危险</span>
                    </div>
                </div>
            </div>
            
            <!-- 分享统计 -->
            <div class="bg-gray-50 rounded-lg p-3">
                <div class="grid grid-cols-3 gap-4 text-center text-sm">
                    <div>
                        <div class="font-semibold text-gray-800">156</div>
                        <div class="text-gray-500 text-xs">查看次数</div>
                    </div>
                    <div>
                        <div class="font-semibold text-gray-800">23</div>
                        <div class="text-gray-500 text-xs">收藏次数</div>
                    </div>
                    <div>
                        <div class="font-semibold text-gray-800">7</div>
                        <div class="text-gray-500 text-xs">分享次数</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 分享方式选择 -->
        <div class="mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">选择分享方式</h3>
            <div class="grid grid-cols-3 gap-4">
                
                <!-- 微信好友 -->
                <div class="share-option text-center">
                    <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fab fa-weixin text-green-600 text-2xl"></i>
                    </div>
                    <span class="text-sm text-gray-700">微信好友</span>
                </div>
                
                <!-- 微信群 -->
                <div class="share-option text-center">
                    <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-users text-green-600 text-xl"></i>
                    </div>
                    <span class="text-sm text-gray-700">微信群</span>
                </div>
                
                <!-- 朋友圈 -->
                <div class="share-option text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-globe text-blue-600 text-xl"></i>
                    </div>
                    <span class="text-sm text-gray-700">朋友圈</span>
                </div>
                
                <!-- QQ -->
                <div class="share-option text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fab fa-qq text-blue-600 text-2xl"></i>
                    </div>
                    <span class="text-sm text-gray-700">QQ</span>
                </div>
                
                <!-- 邮件 -->
                <div class="share-option text-center">
                    <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-envelope text-gray-600 text-xl"></i>
                    </div>
                    <span class="text-sm text-gray-700">邮件</span>
                </div>
                
                <!-- 复制链接 -->
                <div class="share-option text-center">
                    <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-link text-purple-600 text-xl"></i>
                    </div>
                    <span class="text-sm text-gray-700">复制链接</span>
                </div>
                
            </div>
        </div>
        
        <!-- 二维码分享 -->
        <div class="share-card p-4 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 text-center">扫码查看MSDS</h3>
            
            <!-- 二维码 -->
            <div class="qr-code w-48 h-48 mx-auto rounded-2xl flex items-center justify-center mb-4">
                <div class="text-center">
                    <i class="fas fa-qrcode text-6xl text-gray-400 mb-2"></i>
                    <p class="text-sm text-gray-500">二维码</p>
                </div>
            </div>
            
            <div class="text-center">
                <p class="text-sm text-gray-600 mb-4">扫描二维码即可快速查看此MSDS信息</p>
                <div class="flex gap-3 justify-center">
                    <button class="flex items-center px-4 py-2 bg-blue-500 text-white rounded-lg text-sm">
                        <i class="fas fa-download mr-2"></i>
                        保存图片
                    </button>
                    <button class="flex items-center px-4 py-2 bg-gray-500 text-white rounded-lg text-sm">
                        <i class="fas fa-share-alt mr-2"></i>
                        分享二维码
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 分享设置 -->
        <div class="share-card p-4">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">分享设置</h3>
            
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h4 class="font-medium text-gray-800">允许他人分享</h4>
                        <p class="text-xs text-gray-500">其他用户可以继续分享此MSDS</p>
                    </div>
                    <div class="w-12 h-6 bg-blue-500 rounded-full relative">
                        <div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5"></div>
                    </div>
                </div>
                
                <div class="flex items-center justify-between">
                    <div>
                        <h4 class="font-medium text-gray-800">显示分享者信息</h4>
                        <p class="text-xs text-gray-500">在分享页面显示您的用户信息</p>
                    </div>
                    <div class="w-12 h-6 bg-gray-300 rounded-full relative">
                        <div class="w-5 h-5 bg-white rounded-full absolute left-0.5 top-0.5"></div>
                    </div>
                </div>
                
                <div class="flex items-center justify-between">
                    <div>
                        <h4 class="font-medium text-gray-800">分享统计</h4>
                        <p class="text-xs text-gray-500">记录分享和查看数据</p>
                    </div>
                    <div class="w-12 h-6 bg-blue-500 rounded-full relative">
                        <div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5"></div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-2">
        <div class="flex justify-around items-center">
            <div class="text-center">
                <i class="fas fa-home text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">首页</span>
            </div>
            <div class="text-center">
                <i class="fas fa-search text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">搜索</span>
            </div>
            <div class="text-center">
                <i class="fas fa-qrcode text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">扫码</span>
            </div>
            <div class="text-center">
                <i class="fas fa-user text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">我的</span>
            </div>
        </div>
    </div>
    
</body>
</html>
