<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS管理 - 扫码查阅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scan-frame {
            width: 250px;
            height: 250px;
            border: 2px solid #10b981;
            border-radius: 12px;
            position: relative;
            background: rgba(16, 185, 129, 0.1);
        }
        .scan-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #10b981;
        }
        .corner-tl {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        .corner-tr {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }
        .corner-bl {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }
        .corner-br {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
        .scan-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-125px); }
            100% { transform: translateY(125px); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <!-- 微信小程序状态栏 -->
    <div class="bg-black text-white text-xs px-4 py-1 flex justify-between items-center">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-three-quarters text-xs"></i>
        </div>
    </div>
    
    <!-- 导航栏 -->
    <div class="bg-gray-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center">
            <i class="fas fa-arrow-left text-white mr-4 text-lg"></i>
            <span class="text-lg font-medium">扫码查阅MSDS</span>
        </div>
        <div class="flex items-center gap-4">
            <i class="fas fa-image text-gray-300"></i>
            <i class="fas fa-flash text-gray-300"></i>
        </div>
    </div>
    
    <!-- 扫码主界面 -->
    <div class="flex-1 flex flex-col items-center justify-center px-6 py-8">
        
        <!-- 扫码框 -->
        <div class="scan-frame mx-auto mb-8 relative overflow-hidden">
            <div class="scan-corner corner-tl"></div>
            <div class="scan-corner corner-tr"></div>
            <div class="scan-corner corner-bl"></div>
            <div class="scan-corner corner-br"></div>
            
            <!-- 扫描线 -->
            <div class="absolute top-0 left-0 right-0">
                <div class="scan-line"></div>
            </div>
            
            <!-- 中心图标 -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-16 h-16 bg-green-500 bg-opacity-20 rounded-full flex items-center justify-center pulse">
                    <i class="fas fa-qrcode text-green-400 text-2xl"></i>
                </div>
            </div>
        </div>
        
        <!-- 提示文字 -->
        <div class="text-center mb-8">
            <h2 class="text-xl font-semibold mb-2">将二维码放入框内</h2>
            <p class="text-gray-400 text-sm leading-relaxed">
                对准化学品标签上的二维码<br>
                即可快速查看MSDS信息
            </p>
        </div>
        
        <!-- 功能按钮 -->
        <div class="flex gap-6 mb-8">
            <button class="flex flex-col items-center">
                <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center mb-2">
                    <i class="fas fa-image text-gray-300"></i>
                </div>
                <span class="text-xs text-gray-400">相册</span>
            </button>
            
            <button class="flex flex-col items-center">
                <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center mb-2">
                    <i class="fas fa-flash text-yellow-400"></i>
                </div>
                <span class="text-xs text-gray-400">闪光灯</span>
            </button>
            
            <button class="flex flex-col items-center">
                <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center mb-2">
                    <i class="fas fa-history text-gray-300"></i>
                </div>
                <span class="text-xs text-gray-400">历史</span>
            </button>
        </div>
        
        <!-- 最近扫描 -->
        <div class="w-full max-w-sm">
            <h3 class="text-sm font-medium text-gray-300 mb-3">最近扫描</h3>
            <div class="space-y-3">
                <div class="bg-gray-800 rounded-lg p-3 flex items-center">
                    <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=40&h=40&fit=crop&crop=center" 
                         alt="化学试剂" class="w-10 h-10 rounded-lg object-cover mr-3">
                    <!-- 图片来源: https://images.unsplash.com/photo-1532187863486-abf9dbad1b69 -->
                    <div class="flex-1">
                        <h4 class="text-sm font-medium text-white">乙醇</h4>
                        <p class="text-xs text-gray-400">2小时前</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-500 text-sm"></i>
                </div>
                
                <div class="bg-gray-800 rounded-lg p-3 flex items-center">
                    <img src="https://images.unsplash.com/photo-1559757148-5c350d0d3c56?w=40&h=40&fit=crop&crop=center" 
                         alt="化学试剂" class="w-10 h-10 rounded-lg object-cover mr-3">
                    <!-- 图片来源: https://images.unsplash.com/photo-1559757148-5c350d0d3c56 -->
                    <div class="flex-1">
                        <h4 class="text-sm font-medium text-white">丙酮</h4>
                        <p class="text-xs text-gray-400">1天前</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-500 text-sm"></i>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- 底部提示 -->
    <div class="bg-gray-800 px-6 py-4">
        <div class="flex items-center justify-center">
            <i class="fas fa-info-circle text-blue-400 mr-2"></i>
            <span class="text-sm text-gray-300">确保光线充足，保持设备稳定</span>
        </div>
    </div>
    
    <!-- 底部导航栏 -->
    <div class="bg-gray-800 border-t border-gray-700 px-4 py-2">
        <div class="flex justify-around items-center">
            <div class="text-center">
                <i class="fas fa-home text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">首页</span>
            </div>
            <div class="text-center">
                <i class="fas fa-search text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">搜索</span>
            </div>
            <div class="text-center">
                <i class="fas fa-qrcode text-green-400 text-lg mb-1"></i>
                <span class="text-xs text-green-400 font-medium">扫码</span>
            </div>
            <div class="text-center">
                <i class="fas fa-user text-gray-400 text-lg mb-1"></i>
                <span class="text-xs text-gray-400">我的</span>
            </div>
        </div>
    </div>
    
</body>
</html>
