<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS文件管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .prototype-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }
        .prototype-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            position: relative;
            border: 1px solid #d1d1d6;
        }
        .screen {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .screen-label {
            text-align: center;
            font-weight: 600;
            margin-top: 1rem;
            color: #1d1d1f;
        }
    </style>
</head>
<body>
    <header class="bg-gray-900 text-white p-6">
        <h1 class="text-3xl font-bold">MSDS文件管理系统 - 原型设计</h1>
        <p class="mt-2">极简风格的危险化学品说明书文档管理系统</p>
    </header>

    <div class="prototype-container">
        <!-- Login Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">登录页面</h3>
                <div class="phone-frame">
                    <iframe src="login.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Register Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">注册页面</h3>
                <div class="phone-frame">
                    <iframe src="register.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Search Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">搜索页面</h3>
                <div class="phone-frame">
                    <iframe src="search.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Search Results Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">搜索结果</h3>
                <div class="phone-frame">
                    <iframe src="search_results.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Document Detail Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">文档详情</h3>
                <div class="phone-frame">
                    <iframe src="document_detail.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Favorites Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">收藏夹</h3>
                <div class="phone-frame">
                    <iframe src="favorites.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Settings Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">设置页面</h3>
                <div class="phone-frame">
                    <iframe src="settings.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- Chemical Detail Page -->
            <div class="prototype-frame">
                <h3 class="text-xl font-semibold mb-4 text-center">化学品详情</h3>
                <div class="phone-frame">
                    <iframe src="chemical_detail.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>
    </div>
</body>
</html>
