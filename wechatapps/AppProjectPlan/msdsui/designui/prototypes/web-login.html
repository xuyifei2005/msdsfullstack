<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS管理系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            position: relative;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #667eea;
        }
        .floating-label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            transition: all 0.2s ease;
            pointer-events: none;
            color: #9ca3af;
        }
        .browser-frame {
            background: #f3f4f6;
            border-radius: 8px 8px 0 0;
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        .browser-buttons {
            display: flex;
            gap: 8px;
        }
        .browser-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .browser-button.close { background: #ff5f57; }
        .browser-button.minimize { background: #ffbd2e; }
        .browser-button.maximize { background: #28ca42; }
        .address-bar {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 4px 12px;
            margin-left: 16px;
            flex: 1;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 浏览器窗口模拟 -->
    <div class="max-w-6xl mx-auto mt-8 bg-white rounded-lg shadow-2xl overflow-hidden">
        <!-- 浏览器标题栏 -->
        <div class="browser-frame">
            <div class="flex items-center">
                <div class="browser-buttons">
                    <div class="browser-button close"></div>
                    <div class="browser-button minimize"></div>
                    <div class="browser-button maximize"></div>
                </div>
                <div class="address-bar">
                    <i class="fas fa-lock text-green-500 mr-2"></i>
                    https://msds-admin.company.com/login
                </div>
                <div class="ml-4 flex items-center gap-2">
                    <i class="fas fa-star text-gray-400"></i>
                    <i class="fas fa-user-circle text-gray-400"></i>
                    <i class="fas fa-ellipsis-v text-gray-400"></i>
                </div>
            </div>
        </div>
        
        <!-- 登录页面内容 -->
        <div class="login-container flex items-center justify-center p-8">
            <div class="login-card rounded-2xl p-8 w-full max-w-md">
                
                <!-- Logo和标题 -->
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-flask text-white text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">MSDS管理系统</h1>
                    <p class="text-gray-600 text-sm">Material Safety Data Sheet Management</p>
                </div>
                
                <!-- 登录表单 -->
                <form class="space-y-6">
                    
                    <!-- 用户名输入 -->
                    <div class="input-group">
                        <input type="text" 
                               id="username" 
                               placeholder=" "
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 bg-white">
                        <label for="username" class="floating-label">用户名 / 邮箱</label>
                    </div>
                    
                    <!-- 密码输入 -->
                    <div class="input-group">
                        <input type="password" 
                               id="password" 
                               placeholder=" "
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 bg-white">
                        <label for="password" class="floating-label">密码</label>
                        <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- 记住我和忘记密码 -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-600">记住我</span>
                        </label>
                        <a href="#" class="text-sm text-blue-600 hover:text-blue-800 transition-colors">忘记密码？</a>
                    </div>
                    
                    <!-- 登录按钮 -->
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-medium hover:from-blue-600 hover:to-purple-700 transition-all duration-200 transform hover:scale-105 focus:ring-4 focus:ring-blue-200">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        登录
                    </button>
                    
                    <!-- 分割线 -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">或者</span>
                        </div>
                    </div>
                    
                    <!-- 第三方登录 -->
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" 
                                class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fab fa-microsoft text-blue-600 mr-2"></i>
                            <span class="text-sm text-gray-700">企业账号</span>
                        </button>
                        <button type="button" 
                                class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fas fa-id-card text-green-600 mr-2"></i>
                            <span class="text-sm text-gray-700">LDAP</span>
                        </button>
                    </div>
                    
                </form>
                
                <!-- 底部信息 -->
                <div class="mt-8 text-center">
                    <p class="text-xs text-gray-500 mb-2">没有账号？请联系系统管理员</p>
                    <div class="flex items-center justify-center gap-4 text-xs text-gray-400">
                        <a href="#" class="hover:text-gray-600">使用帮助</a>
                        <span>|</span>
                        <a href="#" class="hover:text-gray-600">隐私政策</a>
                        <span>|</span>
                        <a href="#" class="hover:text-gray-600">服务条款</a>
                    </div>
                </div>
                
            </div>
        </div>
        
        <!-- 页面底部 -->
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-200">
            <div class="flex items-center justify-between text-sm text-gray-500">
                <div class="flex items-center gap-4">
                    <span>© 2024 MSDS管理系统</span>
                    <span>版本 v1.0.0</span>
                </div>
                <div class="flex items-center gap-4">
                    <span>系统状态: </span>
                    <div class="flex items-center">
                        <div class="w-2 h-2 bg-green-500 rounded-full mr-1"></div>
                        <span class="text-green-600">正常运行</span>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
</body>
</html>
