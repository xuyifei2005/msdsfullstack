<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS 管理系统 - 用户管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900">用户管理</h1>
                <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-user-plus mr-2"></i>添加用户
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 左侧统计 -->
            <div class="lg:col-span-1">
                <div class="space-y-6">
                    <!-- 用户统计 -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">用户统计</h3>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">总用户数</span>
                                <span class="text-lg font-bold text-gray-900">86</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">活跃用户</span>
                                <span class="text-lg font-bold text-green-600">68</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">管理员</span>
                                <span class="text-lg font-bold text-blue-600">5</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">待审核</span>
                                <span class="text-lg font-bold text-orange-600">3</span>
                            </div>
                        </div>
                    </div>

                    <!-- 角色管理 -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">用户角色</h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg">
                                <div>
                                    <p class="font-medium text-gray-900">超级管理员</p>
                                    <p class="text-xs text-gray-600">完全权限</p>
                                </div>
                                <span class="text-sm text-gray-500">2人</span>
                            </div>
                            <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg">
                                <div>
                                    <p class="font-medium text-gray-900">实验室管理员</p>
                                    <p class="text-xs text-gray-600">管理MSDS和用户</p>
                                </div>
                                <span class="text-sm text-gray-500">8人</span>
                            </div>
                            <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg">
                                <div>
                                    <p class="font-medium text-gray-900">科研人员</p>
                                    <p class="text-xs text-gray-600">查阅和下载</p>
                                </div>
                                <span class="text-sm text-gray-500">76人</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧用户列表 -->
            <div class="lg:col-span-3">
                <!-- 筛选栏 -->
                <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                    <div class="flex items-center space-x-4">
                        <div class="relative flex-1">
                            <input type="text" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                   placeholder="搜索用户名、邮箱、部门...">
                            <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                        <select class="px-3 py-2 border border-gray-300 rounded-lg">
                            <option>全部角色</option>
                            <option>超级管理员</option>
                            <option>实验室管理员</option>
                            <option>科研人员</option>
                        </select>
                        <select class="px-3 py-2 border border-gray-300 rounded-lg">
                            <option>全部状态</option>
                            <option>活跃</option>
                            <option>待审核</option>
                            <option>已禁用</option>
                        </select>
                    </div>
                </div>

                <!-- 用户列表 -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <!-- 表头 -->
                    <div class="bg-gray-50 px-6 py-3 border-b border-gray-200">
                        <div class="grid grid-cols-12 gap-4 text-sm font-medium text-gray-600">
                            <div class="col-span-1">
                                <input type="checkbox">
                            </div>
                            <div class="col-span-3">用户信息</div>
                            <div class="col-span-2">角色</div>
                            <div class="col-span-2">部门</div>
                            <div class="col-span-2">状态</div>
                            <div class="col-span-2">操作</div>
                        </div>
                    </div>

                    <!-- 用户列表项 -->
                    <div class="divide-y divide-gray-200">
                        <!-- 用户1 -->
                        <div class="px-6 py-4 hover:bg-gray-50">
                            <div class="grid grid-cols-12 gap-4 items-center">
                                <div class="col-span-1">
                                    <input type="checkbox">
                                </div>
                                <div class="col-span-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
                                            <span class="text-white font-medium">张</span>
                                        </div>
                                        <div>
                                            <h4 class="font-medium text-gray-900">张实验师</h4>
                                            <p class="text-sm text-gray-600">zhang.lab@university.edu</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-span-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-blue-100 text-blue-800">
                                        实验室管理员
                                    </span>
                                </div>
                                <div class="col-span-2">
                                    <span class="text-sm text-gray-900">化学系</span>
                                </div>
                                <div class="col-span-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-green-100 text-green-800">
                                        <i class="fas fa-circle text-xs mr-1"></i>
                                        活跃
                                    </span>
                                </div>
                                <div class="col-span-2">
                                    <div class="flex items-center space-x-2">
                                        <button class="p-2 text-gray-600 hover:text-blue-600" title="编辑">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-green-600" title="权限">
                                            <i class="fas fa-key"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-orange-600" title="重置密码">
                                            <i class="fas fa-lock"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-red-600" title="禁用">
                                            <i class="fas fa-ban"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 用户2 -->
                        <div class="px-6 py-4 hover:bg-gray-50">
                            <div class="grid grid-cols-12 gap-4 items-center">
                                <div class="col-span-1">
                                    <input type="checkbox">
                                </div>
                                <div class="col-span-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center">
                                            <span class="text-white font-medium">李</span>
                                        </div>
                                        <div>
                                            <h4 class="font-medium text-gray-900">李研究员</h4>
                                            <p class="text-sm text-gray-600">li.research@university.edu</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-span-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-gray-100 text-gray-800">
                                        科研人员
                                    </span>
                                </div>
                                <div class="col-span-2">
                                    <span class="text-sm text-gray-900">生物系</span>
                                </div>
                                <div class="col-span-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-green-100 text-green-800">
                                        <i class="fas fa-circle text-xs mr-1"></i>
                                        活跃
                                    </span>
                                </div>
                                <div class="col-span-2">
                                    <div class="flex items-center space-x-2">
                                        <button class="p-2 text-gray-600 hover:text-blue-600" title="编辑">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-green-600" title="权限">
                                            <i class="fas fa-key"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-orange-600" title="重置密码">
                                            <i class="fas fa-lock"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-red-600" title="禁用">
                                            <i class="fas fa-ban"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 用户3 -->
                        <div class="px-6 py-4 hover:bg-gray-50">
                            <div class="grid grid-cols-12 gap-4 items-center">
                                <div class="col-span-1">
                                    <input type="checkbox">
                                </div>
                                <div class="col-span-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-purple-500 rounded-full flex items-center justify-center">
                                            <span class="text-white font-medium">王</span>
                                        </div>
                                        <div>
                                            <h4 class="font-medium text-gray-900">王博士</h4>
                                            <p class="text-sm text-gray-600">wang.phd@university.edu</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-span-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-gray-100 text-gray-800">
                                        科研人员
                                    </span>
                                </div>
                                <div class="col-span-2">
                                    <span class="text-sm text-gray-900">材料系</span>
                                </div>
                                <div class="col-span-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-orange-100 text-orange-800">
                                        <i class="fas fa-clock text-xs mr-1"></i>
                                        待审核
                                    </span>
                                </div>
                                <div class="col-span-2">
                                    <div class="flex items-center space-x-2">
                                        <button class="p-2 text-gray-600 hover:text-green-600" title="审核通过">
                                            <i class="fas fa-check"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-red-600" title="审核拒绝">
                                            <i class="fas fa-times"></i>
                                        </button>
                                        <button class="p-2 text-gray-600 hover:text-blue-600" title="编辑">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 分页 -->
                <div class="bg-white rounded-lg shadow-sm p-6 mt-6">
                    <div class="flex items-center justify-between">
                        <div class="text-sm text-gray-600">
                            显示 1-20 条，共 86 条记录
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50" disabled>
                                上一页
                            </button>
                            <button class="px-3 py-2 bg-blue-600 text-white rounded">1</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50">2</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50">3</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50">4</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50">5</button>
                            <button class="px-3 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50">
                                下一页
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
