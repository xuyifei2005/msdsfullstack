<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS管理系统 - 扫码查阅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .miniprogram-container {
            max-width: 375px;
            margin: 0 auto;
            background: #000;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .status-bar {
            height: 44px;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            z-index: 10;
        }
        
        .navigation-bar {
            height: 44px;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            position: relative;
            z-index: 10;
        }
        
        .scan-container {
            position: relative;
            height: calc(100vh - 88px);
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .camera-view {
            width: 280px;
            height: 280px;
            position: relative;
            background: linear-gradient(45deg, #1a1a1a 25%, transparent 25%), 
                        linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1a1a1a 75%), 
                        linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid transparent;
        }
        
        .scan-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #1aad19;
        }
        
        .scan-corner.top-left {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        
        .scan-corner.top-right {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }
        
        .scan-corner.bottom-left {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }
        
        .scan-corner.bottom-right {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #1aad19, transparent);
            animation: scanAnimation 2s linear infinite;
        }
        
        @keyframes scanAnimation {
            0% { transform: translateY(0); }
            100% { transform: translateY(200px); }
        }
        
        .scan-tips {
            color: white;
            text-align: center;
            margin-top: 40px;
            padding: 0 40px;
        }
        
        .scan-tips h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .scan-tips p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }
        
        .scan-actions {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        
        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }
        
        .action-btn.primary {
            background: #1aad19;
            border-color: #1aad19;
        }
        
        .action-btn.primary:hover {
            background: #2dc653;
            border-color: #2dc653;
        }
        
        .flash-btn {
            position: absolute;
            top: 120px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        
        .flash-btn.active {
            background: #1aad19;
            color: white;
        }
        
        .history-btn {
            position: absolute;
            top: 120px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        
        .scan-result {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 20;
        }
        
        .scan-result.show {
            transform: translateY(0);
        }
        
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        
        .chemical-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .chemical-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .chemical-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .info-tag {
            background: #e8f5e8;
            color: #1aad19;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        .danger-tag {
            background: #ffe6e6;
            color: #ff4757;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: #1aad19;
            color: white;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
    </style>
</head>
<body class="bg-black">
    <div class="miniprogram-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span></span>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="navigation-bar">
            <div class="flex items-center">
                <i class="fas fa-arrow-left mr-3 cursor-pointer"></i>
                <span>扫码查阅</span>
            </div>
            <i class="fas fa-ellipsis-h cursor-pointer"></i>
        </div>
        
        <!-- 扫码容器 -->
        <div class="scan-container">
            <!-- 闪光灯按钮 -->
            <div class="flash-btn" id="flashBtn">
                <i class="fas fa-bolt"></i>
            </div>
            
            <!-- 历史记录按钮 -->
            <div class="history-btn">
                <i class="fas fa-history"></i>
            </div>
            
            <!-- 相机视图 -->
            <div class="camera-view">
                <!-- 扫描框 -->
                <div class="scan-frame">
                    <div class="scan-corner top-left"></div>
                    <div class="scan-corner top-right"></div>
                    <div class="scan-corner bottom-left"></div>
                    <div class="scan-corner bottom-right"></div>
                    <div class="scan-line"></div>
                </div>
            </div>
            
            <!-- 扫码提示 -->
            <div class="scan-tips">
                <h3>将二维码放入框内</h3>
                <p>对准化学品标签上的二维码<br>即可快速查看MSDS信息</p>
            </div>
            
            <!-- 底部操作按钮 -->
            <div class="scan-actions">
                <div class="action-btn">
                    <i class="fas fa-image"></i>
                </div>
                <div class="action-btn primary" id="scanBtn">
                    <i class="fas fa-camera"></i>
                </div>
                <div class="action-btn">
                    <i class="fas fa-keyboard"></i>
                </div>
            </div>
        </div>
        
        <!-- 扫描结果弹窗 -->
        <div class="scan-result" id="scanResult">
            <div class="result-header">
                <div class="result-title">扫描结果</div>
                <div class="close-btn" id="closeResult">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            
            <div class="chemical-card">
                <div class="chemical-name">乙醇 (Ethanol)</div>
                <div class="chemical-info">
                    <span class="info-tag">CAS: 64-17-5</span>
                    <span class="info-tag">分子式: C₂H₆O</span>
                    <span class="info-tag danger-tag">易燃</span>
                </div>
                <div class="text-sm text-gray-600 mb-3">
                    供应商: 国药集团化学试剂有限公司<br>
                    更新时间: 2024-01-15
                </div>
                <div class="action-buttons">
                    <div class="btn btn-secondary">
                        <i class="fas fa-heart mr-2"></i>收藏
                    </div>
                    <div class="btn btn-primary">
                        <i class="fas fa-eye mr-2"></i>查看详情
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 页面跳转函数
        function navigateTo(page) {
            window.location.href = page;
        }

        // 闪光灯切换
        document.getElementById('flashBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });
        
        // 模拟扫码成功
        document.getElementById('scanBtn').addEventListener('click', function() {
            // 添加扫码动画效果
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
                // 显示扫描结果
                document.getElementById('scanResult').classList.add('show');
            }, 200);
        });
        
        // 关闭扫描结果
        document.getElementById('closeResult').addEventListener('click', function() {
            document.getElementById('scanResult').classList.remove('show');
        });
        
        // 返回按钮
        document.querySelector('.fa-arrow-left').addEventListener('click', function() {
            navigateTo('home.html');
        });
        
        // 相册选择
        document.querySelector('.fa-image').parentElement.addEventListener('click', function() {
            // 模拟从相册选择图片
            console.log('从相册选择');
        });
        
        // 手动输入
        document.querySelector('.fa-keyboard').parentElement.addEventListener('click', function() {
            // 模拟手动输入
            console.log('手动输入');
        });
        
        // 历史记录
        document.querySelector('.history-btn').addEventListener('click', function() {
            console.log('查看扫码历史');
        });
        
        // 扫描结果操作
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
                
                // 添加跳转逻辑
                if (this.textContent.includes('查看详情')) {
                    navigateTo('msds-detail.html?id=ethanol&source=scan');
                }
            });
        });
        
        // 模拟扫码动画
        setInterval(() => {
            const scanLine = document.querySelector('.scan-line');
            scanLine.style.animation = 'none';
            setTimeout(() => {
                scanLine.style.animation = 'scanAnimation 2s linear infinite';
            }, 10);
        }, 2000);
    </script>
</body>
</html>
