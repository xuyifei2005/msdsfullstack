<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>若依移动端注册</title>
    <!-- Use FontAwesome to replace iconfont -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        .normal-login-container {
            width: 100%;
            min-height: 100vh;
            overflow-y: auto;
        }

        .logo-content {
            width: 100%;
            font-size: 21px;
            text-align: center;
            padding-top: 15%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-content img {
            width: 50px; /* 100rpx */
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
        }

        .logo-content .title {
            margin-left: 10px;
            font-weight: 500;
        }

        .login-form-content {
            text-align: center;
            margin: 20px auto;
            margin-top: 15%;
            width: 80%;
        }

        .input-item {
            margin: 20px auto;
            background-color: #f5f6f7;
            height: 45px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .input-item .icon {
            font-size: 19px; /* 38rpx */
            margin-left: 15px;
            color: #999;
            width: 20px;
            text-align: center;
        }

        .input-item input {
            flex: 1;
            width: 100%;
            font-size: 14px;
            line-height: 20px;
            text-align: left;
            padding-left: 15px;
            padding-right: 15px;
            background: transparent;
            border: none;
            outline: none;
            height: 100%;
            color: #333;
        }

        /* Captcha specific styles */
        .input-item.captcha-row {
            background-color: transparent; /* Container is transparent */
            display: flex;
            justify-content: space-between;
            margin: 20px auto;
            padding: 0;
        }

        .captcha-input-wrap {
            width: 60%;
            background-color: #f5f6f7;
            height: 45px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }

        .login-code {
            width: 35%; /* Remaining space roughly */
            height: 38px; /* From vue */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-code img {
            width: 100px; /* 200rpx */
            height: 38px;
            cursor: pointer;
        }

        .action-btn {
            margin-top: 40px;
        }

        .register-btn {
            width: 100%;
            height: 45px;
            border-radius: 22.5px; /* round */
            background-color: #0081ff; /* bg-blue ColorUI roughly */
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            box-shadow: 0 3px 6px rgba(0, 129, 255, 0.2);
            transition: opacity 0.2s;
        }

        .register-btn:active {
            opacity: 0.8;
        }

        .xieyi {
            text-align: center;
            margin-top: 20px;
        }

        .text-blue {
            color: #0081ff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* Utilities */
        .flex { display: flex; }
        .align-center { align-items: center; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
    </style>
</head>
<body>
    <div class="normal-login-container">
        <div class="logo-content">
            <!-- Placeholder logo since we don't have the exact asset path -->
            <img src="https://ruoyi.vip/images/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/100x100?text=Logo'">
            <span class="title">若依移动端注册</span>
        </div>

        <div class="login-form-content">
            <!-- Username -->
            <div class="input-item">
                <i class="fas fa-user icon"></i>
                <input type="text" id="username" placeholder="请输入账号" maxlength="30">
            </div>

            <!-- Password -->
            <div class="input-item">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="password" placeholder="请输入密码" maxlength="20">
            </div>

            <!-- Confirm Password -->
            <div class="input-item">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="confirmPassword" placeholder="请输入重复密码" maxlength="20">
            </div>

            <!-- Captcha (Code) -->
            <!-- Mimicking the Vue structure where width is 60% for the input part -->
            <div class="input-item captcha-row">
                <div class="captcha-input-wrap">
                    <i class="fas fa-shield-alt icon"></i>
                    <input type="number" id="code" placeholder="请输入验证码" maxlength="4">
                </div>
                <div class="login-code">
                    <img src="https://via.placeholder.com/200x76?text=CAPTCHA" alt="验证码" id="captcha-img" onclick="refreshCaptcha()">
                </div>
            </div>

            <div class="action-btn">
                <button class="register-btn" onclick="handleRegister()">注册</button>
            </div>
        </div>

        <div class="xieyi">
            <span class="text-blue" onclick="handleUserLogin()">使用已有账号登录</span>
        </div>
    </div>

    <script>
        // Mock functions to simulate Vue methods
        
        function refreshCaptcha() {
            const img = document.getElementById('captcha-img');
            img.src = 'https://via.placeholder.com/200x76?text=' + Math.floor(Math.random() * 10000);
        }

        function handleUserLogin() {
            window.location.href = 'login.html';
        }

        function handleRegister() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const code = document.getElementById('code').value;

            if (!username) {
                alert("请输入您的账号");
                return;
            }
            if (!password) {
                alert("请输入您的密码");
                return;
            }
            if (!confirmPassword) {
                alert("请再次输入您的密码");
                return;
            }
            if (password !== confirmPassword) {
                alert("两次输入的密码不一致");
                return;
            }
            if (!code) {
                alert("请输入验证码");
                return;
            }

            // Simulate loading
            const btn = document.querySelector('.register-btn');
            const originalText = btn.innerText;
            btn.innerText = "注册中...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            setTimeout(() => {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.style.opacity = "1";
                
                if (confirm("系统提示\n恭喜你，您的账号 " + username + " 注册成功！")) {
                    window.location.href = 'login.html';
                }
            }, 1500);
        }

        // Initialize captcha on load
        refreshCaptcha();
    </script>
</body>
</html>
