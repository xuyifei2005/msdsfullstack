### 生产环境Docker Compose配置
# 域名: flymsds.cn
# 服务器IP: 39.107.211.72
# 用于生产环境部署

networks:
  msds_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  # MySQL数据库 - 生产环境
  msdsmysql:
    networks:
      - msds_network
    image: mysql:8.0
    container_name: msdsmysql-prod
    hostname: msdsmysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4' --init-connect='SET collation_connection = utf8mb4_unicode_ci' --skip-character-set-client-handshake
    environment:
      MYSQL_DATABASE: msds_prod
      MYSQL_USER: msds_prod_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-FlyMsds2025Prod!@#}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-FlyMsds2025Root!@#}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 使用命名卷持久化数据，避免数据丢失
      - msdsmysql_data_prod:/var/lib/mysql
      # 数据库初始化脚本
      - ./msdsfullstatckcompose/msdsdatabaseinitdb:/docker-entrypoint-initdb.d:ro
      # MySQL配置文件
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-msds_root_password_2024}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis缓存 - 生产环境
  msdsredis:
    networks:
      - msds_network
    image: redis:7-alpine
    container_name: msdsredis-prod
    hostname: msdsredis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-FlyMsds2025Redis!@#} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - msdsredis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 后端服务 - 生产环境
  msdsbackend:
    networks:
      - msds_network
    # 使用镜像仓库（CI/CD自动构建推送）
    image: ${REGISTRY:-registry.cn-beijing.aliyuncs.com}/msds/backend:${BACKEND_TAG:-latest}
    # 本地开发时可以取消注释下面的build配置
    # build:
    #   context: ../msdsPC/ruoyi-MsdsPc-react
    #   dockerfile: Dockerfile.prod
    #   args:
    #     - SPRING_PROFILE=prod
    pull_policy: always
    container_name: msdsbackend-prod
    hostname: msdsbackend
    restart: always
    depends_on:
      msdsmysql:
        condition: service_healthy
      msdsredis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://msdsmysql:3306/msds_prod?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=msds_prod_user
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-FlyMsds2025Prod!@#}
      - SPRING_REDIS_HOST=msdsredis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:-FlyMsds2025Redis!@#}
      - JAVA_OPTS=-Xms1024m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 文件上传目录持久化
      - msds_upload_prod:/app/uploadPath
      # 日志持久化
      - msds_logs_prod:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Nginx服务 - 生产环境（前端）
  msdsnginx:
    networks:
      - msds_network
    # 使用镜像仓库（CI/CD自动构建推送）
    image: ${REGISTRY:-registry.cn-beijing.aliyuncs.com}/msds/frontend:${FRONTEND_TAG:-latest}
    # 本地开发时使用nginx官方镜像+本地挂载
    # image: nginx:alpine
    pull_policy: always
    container_name: msdsnginx-prod
    hostname: msdsnginx
    restart: always
    depends_on:
      msdsbackend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx配置文件（可选，镜像内已包含）
      # - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/conf.d/msds.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL证书 - 如需HTTPS支持
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 前端静态文件（使用镜像内置，无需挂载）
      # - ./nginx/html:/usr/share/nginx/html:ro
      # 日志持久化
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  msdsmysql_data_prod:
    driver: local
  msdsredis_data_prod:
    driver: local
  msds_upload_prod:
    driver: local
  msds_logs_prod:
    driver: local

