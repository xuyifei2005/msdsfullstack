### 生产环境Docker Compose配置
# 域名: flymsds.cn
# 服务器IP: 39.107.211.72
# 用于生产环境部署

### 部署前准备
# 1. 确保已编译的前端文件存在：
#    ../msdsPC/ruoyi-MsdsPc-react/react-ui/dist
# 2. 确保已编译的后端JAR文件存在：
#    ../msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar
# 3. 确保Docker镜像已加载：
#    docker load -i msdsmysql_image.tar
#    docker load -i msdsredis_image.tar
#    docker load -i msdsbackend_image.tar
#    docker load -i msdsfrontend_image.tar
#    docker load -i msdsnginx_image.tar

#
# 4. 加载镜像后重新打标签（如果需要）：
#    docker tag msds_exported_mysql msdsmysql:latest
#    docker tag msds_exported_redis msdsredis:latest
#    docker tag msds_exported_backend msdsbackend:latest
#    docker tag msds_exported_frontend msdsnginx:latest
#    docker tag labsys_exported_nginx msdsnginx:latest

#
# 5. 启动服务：
#    docker-compose -f docker-compose.prod.yml up -d
#
# 6. 查看服务状态：
#    docker-compose -f docker-compose.prod.yml ps
#
# 7. 查看日志：
#    docker-compose -f docker-compose.prod.yml logs -f msdsbackend

version: '3.8'

# 定义Docker网络配置
networks:
  msds_network:
    # Docker网络驱动类型有以下几种:
    # - bridge: 默认驱动,创建独立的网络命名空间,容器间通过虚拟网桥通信
    # - host: 容器直接使用宿主机网络,性能好但缺乏隔离
    # - none: 容器没有网络功能
    # - overlay: 用于Docker Swarm集群中跨主机容器通信
    # - macvlan: 允许容器直接连接物理网络
    driver: bridge

services:

  # Nginx服务（前端反向代理）
  msdsnginx:
    networks:
      - msds_network
    image: msdsnginx:latest
    container_name: msdsnginx
    hostname: msdsnginx
    restart: always
    # 镜像拉取策略：never表示只使用本地镜像，不从远程拉取
    pull_policy: never
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx配置文件
      - ./nginx/conf.d:/etc/nginx/conf.d
      # SSL证书
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 静态资源 - 直接挂载前端编译后的dist目录,构建frontend-dist路径下的包！
      - ./nginx/html/frontend-dist:/usr/share/nginx/html:ro
      # 日志
      - ./nginx/logs:/var/log/nginx
    # depends_on:
    #   msdsbackend:
    #     condition: service_healthy
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s


  # 后端服务（Spring Boot应用）
  msdsbackend:
    networks:
      - msds_network
    image: msdsbackend
    container_name: msdsbackend
    hostname: msdsbackend
    restart: always
    pull_policy: never
    user: root
    volumes:
      # 应用日志和上传目录
      - backend_logs:/app/logs
      - backend_upload:/app/uploadPath
      # Maven本地仓库持久化（如果需要重新编译）
      - msdsmaven_repository:/root/.m2/repository
    working_dir: /app
    # 生产环境启动命令：使用Dockerfile中构建的JAR文件
    command: ["sh", "-c", "java $JAVA_OPTS -jar app.jar --spring.profiles.active=prod"]
    ports:
      - "18080:8080"
    environment:
      # 使用prod profile
      - SPRING_PROFILES_ACTIVE=prod
      # 数据库配置
      - SPRING_DATASOURCE_URL=jdbc:mysql://msdsmysql:3306/msds_dev?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=msds_user
      - SPRING_DATASOURCE_PASSWORD=msds_dev_password
      # Redis配置
      - SPRING_DATA_REDIS_HOST=msdsredis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_DATABASE=0
      - SPRING_DATA_REDIS_PASSWORD=${MSDS_REDIS_PASSWORD:-}
      - MSDS_REDIS_PASSWORD=${MSDS_REDIS_PASSWORD:-}
      # 时区配置
      - TZ=Asia/Shanghai
      # JVM参数
      - JAVA_OPTS=-Xms512m -Xmx2048m -XX:+UseG1GC -XX:+PrintGCDetails
    depends_on:
      msdsdbinit:
        condition: service_completed_successfully
      msdsmysql:
        condition: service_healthy
      msdsredis:
        condition: service_healthy
    healthcheck:
      # 检查应用健康状态（使用IPv4地址避免localhost解析到IPv6导致连接失败）
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  msdsdbinit:
    networks:
      - msds_network
    image: msdsmysql
    container_name: msdsdbinit
    hostname: msdsdbinit
    pull_policy: never
    depends_on:
      msdsmysql:
        condition: service_started
    volumes:
      - ../aboutproject/msdsdatabases/msds_complete_database.sql:/docker-entrypoint-initdb.d/00-msds_complete_database.sql:ro
    command:
      - sh
      - -c
      - |
        set -e
        until mysqladmin ping -h msdsmysql -uroot -proot_password --silent; do
          sleep 2
        done
        has_sys_menu=$$(mysql -h msdsmysql -uroot -proot_password -N -s -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='msds_dev' AND table_name='sys_menu';")
        table_count=$$(mysql -h msdsmysql -uroot -proot_password -N -s -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='msds_dev';")
        if [ "$$has_sys_menu" = "0" ] && [ "$$table_count" = "0" ]; then
          test -f /docker-entrypoint-initdb.d/00-msds_complete_database.sql
          mysql -h msdsmysql -uroot -proot_password < /docker-entrypoint-initdb.d/00-msds_complete_database.sql
        elif [ "$$has_sys_menu" = "0" ] && [ "$$table_count" != "0" ]; then
          exit 2
        fi

  # MySQL数据库
  msdsmysql:
    networks:
      - msds_network
    image: msdsmysql
    container_name: msdsmysql
    hostname: msdsmysql
    restart: always
    pull_policy: never
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4' --init-connect='SET collation_connection = utf8mb4_unicode_ci' --skip-character-set-client-handshake
    environment:
      # 数据库配置（与开发环境一致）
      MYSQL_DATABASE: msds_dev
      MYSQL_USER: msds_user
      MYSQL_PASSWORD: msds_dev_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 使用命名卷避免共享文件夹权限问题
      - msdsmysql_data:/var/lib/mysql
      # 初始化数据库脚本（仅在首次启动时执行）
      - ../aboutproject/msdsdatabases/msds_complete_database.sql:/docker-entrypoint-initdb.d/00-msds_complete_database.sql:ro
      # MySQL配置文件
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot_password -e \"SELECT 1 FROM msds_dev.sys_menu LIMIT 1;\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # Redis缓存
  msdsredis:
    networks:
      - msds_network
    image: msdsredis
    container_name: msdsredis
    hostname: msdsredis
    restart: always
    pull_policy: never
    volumes:
      - msdsredis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$MSDS_REDIS_PASSWORD\" ]; then redis-cli -a \"$$MSDS_REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - MSDS_REDIS_PASSWORD=${MSDS_REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$MSDS_REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$MSDS_REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'

volumes:
  # 数据持久化卷
  msdsredis_data:
    driver: local
  msdsmysql_data:
    driver: local
  # 应用数据卷
  backend_logs:
    driver: local
  backend_upload:
    driver: local
  # 开发工具卷
  msdsmaven_repository:
    driver: local
  msdsnode_modules:
    driver: local


