# MSDS生产环境站点配置
# 域名: flymsds.cn

# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name flymsds.cn www.flymsds.cn;
    
    # ACME验证路径（用于Let's Encrypt证书续期）
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    
    # 其他所有请求重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name flymsds.cn www.flymsds.cn;
    
    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/flymsds.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/flymsds.cn.key;
    
    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 根目录 - 前端静态文件
    root /usr/share/nginx/html;
    index index.html;
    
    # 访问日志和错误日志
    access_log /var/log/nginx/msds_access.log main;
    error_log /var/log/nginx/msds_error.log warn;
    
    # 前端路由 - SPA应用
    location / {
        try_files $uri $uri/ /index.html;
        
        # 缓存策略
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # 静态资源缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API代理到后端
    location /prod-api/ {
        proxy_pass http://msdsbackend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # 文件上传路径代理
    location /prod-api/profile/ {
        proxy_pass http://msdsbackend:8080/profile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 文件上传大小限制
        client_max_body_size 50M;
    }
    
    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

