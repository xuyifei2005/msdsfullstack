worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    client_max_body_size 2000M;
    include mime.types;
    default_type application/octet-stream;
    
    # 基础优化配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    
    # 安全相关配置
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    
    # 文件缓存配置
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # HTTP服务器 - 重定向到HTTPS
    server {
        listen       80;
        server_name  flymsds.cn www.flymsds.cn;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS服务器
    server {
        listen       443 ssl http2;
        server_name  flymsds.cn www.flymsds.cn;
        charset utf-8;

        # SSL证书配置
        ssl_certificate /etc/nginx/ssl/flymsds.cn.pem;
        ssl_certificate_key /etc/nginx/ssl/flymsds.cn.key;
        
        # SSL安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

		        # 静态资源处理
        location /image/ {
            alias /usr/local/nginx/image/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri $uri/ =404;
            access_log off;
        }

        location /static/proStatic/ {
            alias /usr/local/nginx/static/proStatic/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri $uri/ =404;
            access_log off;
        }

        location /msds/ {
            alias /usr/local/nginx/msds/;
            expires 1d;
            add_header Cache-Control "public, no-transform";
            try_files $uri $uri/ =404;
            limit_except GET {
                deny all;
            }
        }

        location /lsrFile/ {
            alias /usr/local/nginx/lsrFile/;
            expires 1d;
            add_header Cache-Control "public, no-transform";
            try_files $uri $uri/ =404;
            limit_except GET {
                deny all;
            }
        }
		        # 文件上传服务代理
        location ~ /api/v1/stream/ {
            proxy_pass http://labsysupload:8087;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;
            client_max_body_size 2000M;
        }

        location /file/ {
            proxy_pass http://labsysupload:8087/file/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;
            client_max_body_size 2000M;
            
            # 限制上传文件类型
            if ($request_filename ~* \.(php|php5|sh|pl|py)$) {
                return 403;
            }
        }
		location / {
            root   /usr/share/nginx/html;
			try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
		
		        location /prod-api/ {
            proxy_pass http://labsyspc:8188/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;
            
            # 安全头
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
