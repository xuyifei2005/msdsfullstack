### 本地生产环境Docker Compose配置
# 使用本地镜像进行生产环境测试

networks:
  msds_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  # MySQL数据库 - 生产环境
  msdsmysql:
    networks:
      - msds_network
    image: msdsmysql:latest
    container_name: msdsmysql-prod
    hostname: msdsmysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4' --init-connect='SET collation_connection = utf8mb4_unicode_ci' --skip-character-set-client-handshake
    environment:
      MYSQL_DATABASE: msds_prod
      MYSQL_USER: msds_prod_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-FlyMsds2025Prod!@#}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-FlyMsds2025Root!@#}
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      # 使用命名卷持久化数据，避免数据丢失
      - msdsmysql_data_prod:/var/lib/mysql
      # 数据库初始化脚本
      - ./msdsfullstatckcompose/msdsdatabaseinitdb:/docker-entrypoint-initdb.d:ro
      # MySQL配置文件
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-FlyMsds2025Root!@#}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis缓存 - 生产环境
  msdsredis:
    networks:
      - msds_network
    image: msdsredis:latest
    container_name: msdsredis-prod
    hostname: msdsredis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-FlyMsds2025Redis!@#} --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      # Redis数据持久化
      - msdsredis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 后端应用 - 生产环境
  msdsbackend:
    networks:
      - msds_network
    image: msdsbackend:latest
    container_name: msdsbackend-prod
    hostname: msdsbackend
    restart: always
    depends_on:
      msdsmysql:
        condition: service_healthy
      msdsredis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://msdsmysql:3306/msds_prod?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=msds_prod_user
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-FlyMsds2025Prod!@#}
      - SPRING_REDIS_HOST=msdsredis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:-FlyMsds2025Redis!@#}
      - JAVA_OPTS=-Xms1024m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - TZ=Asia/Shanghai
    ports:
      - "18080:8080"
      - "15005:5005"  # 调试端口
    volumes:
      # 文件上传目录持久化
      - msds_upload_prod:/app/uploadPath
      # 日志持久化
      - msds_logs_prod:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 前端服务 - 生产环境
  msdsfrontend:
    networks:
      - msds_network
    image: msdsfrontend:latest
    container_name: msdsfrontend-prod
    hostname: msdsfrontend
    restart: always
    depends_on:
      - msdsbackend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "180:80"
      - "1443:443"
    volumes:
      # Nginx配置
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # SSL证书（如果有）
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 日志持久化
      - msds_nginx_logs_prod:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# 数据卷定义
volumes:
  msdsmysql_data_prod:
    driver: local
  msdsredis_data_prod:
    driver: local
  msds_upload_prod:
    driver: local
  msds_logs_prod:
    driver: local
  msds_nginx_logs_prod:
    driver: local