name: MSDS系统CI/CD流水线

on:
  push:
    branches:
      - main      # 生产环境
      - develop   # 测试环境
  pull_request:
    branches:
      - main

env:
  # 服务器配置
  PRODUCTION_HOST: ${{ secrets.SSH_HOST }}
  PRODUCTION_USER: ${{ secrets.SSH_USER }}
  STAGING_HOST: ${{ secrets.SSH_HOST }}
  STAGING_USER: ${{ secrets.SSH_USER }}

jobs:
  # ==================== 前端构建 ====================
  build-frontend:
    name: 构建前端应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: msdsPC/ruoyi-MsdsPc-react/react-ui/package-lock.json
      
      - name: 安装依赖
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm ci
      
      - name: 运行Lint检查
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run lint || true
      
      - name: 运行测试
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run test -- --passWithNoTests || true
      
      - name: 构建生产版本
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run build:prod
      
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: msdsPC/ruoyi-MsdsPc-react/react-ui/dist
          retention-days: 7

  # ==================== 后端构建 ====================
  build-backend:
    name: 构建后端应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Maven构建
        working-directory: msdsPC/ruoyi-MsdsPc-react
        run: mvn clean package -Pprod -DskipTests -B
      
      - name: 上传后端JAR文件
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar
          retention-days: 7

  # ==================== 部署到生产环境 ====================
  deploy-production:
    name: 部署到生产环境
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://flymsds.cn
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      
      - name: 下载后端JAR文件
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar
      
      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 进入项目目录
            cd /opt/msds/msdsdocker
            
            # 检查docker-compose.prod.yml是否存在
            if [ ! -f docker-compose.prod.yml ]; then
                echo "❌ 错误：docker-compose.prod.yml文件不存在！"
                echo ""
                echo "=== 当前目录结构 ==="
                ls -la
                echo ""
                echo "=== 请先在服务器上初始化项目 ==="
                echo "1. 创建必要的目录结构"
                echo "2. 上传docker-compose.prod.yml文件"
                echo "3. 加载Docker镜像"
                exit 1
            fi
            
            # 诊断Docker环境
            echo "=== 诊断Docker环境 ==="
            echo "Docker版本："
            sudo docker --version 2>/dev/null || echo "Docker未安装"
            echo ""
            echo "Docker Compose版本："
            sudo docker-compose --version 2>/dev/null || sudo docker compose version 2>/dev/null || echo "Docker Compose未安装"
            echo ""
            echo "Docker服务状态："
            sudo systemctl status docker --no-pager | head -n 5
            echo ""
            echo "当前运行的容器："
            sudo docker ps
            echo ""
            echo "=== 诊断完成 ==="
            echo ""
            
            # 创建临时目录用于传输文件
            mkdir -p /tmp/msds-deploy
            
            echo "📦 开始上传构建产物..."
            
            # 备份当前版本
            if [ -d "msdsPC/ruoyi-MsdsPc-react/react-ui/dist" ]; then
              echo "💾 备份前端文件..."
              cp -r msdsPC/ruoyi-MsdsPc-react/react-ui/dist /tmp/msds-deploy/frontend-backup || true
            fi
            
            if [ -f "msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar" ]; then
              echo "💾 备份后端JAR文件..."
              cp msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar /tmp/msds-deploy/backend-backup.jar || true
            fi
            
            # 备份数据库
            echo "💾 备份数据库..."
            sudo docker exec msdsmysql mysqldump -u root -proot_password msds_dev > /tmp/msds-deploy/database-backup.sql || echo "⚠️  数据库备份失败，继续部署"
            
            echo "📥 停止服务..."
            # 检查docker-compose是否可用
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                echo "使用docker-compose停止所有服务..."
                sudo docker-compose -f docker-compose.prod.yml stop
            elif sudo docker compose version &>/dev/null; then
                echo "使用docker compose停止所有服务..."
                sudo docker compose -f docker-compose.prod.yml stop
            else
                echo "docker-compose不可用，使用docker停止单个容器..."
                sudo docker stop msdsbackend msdsnginx msdsmysql msdsredis 2>/dev/null || echo "部分容器不存在"
            fi
            
            echo "⏳ 等待服务停止..."
            sleep 10
            
            echo "✅ 部署完成！"
      
      - name: 上传前端文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-dist/*"
          target: "/opt/msds/msdsdocker/msdsPC/ruoyi-MsdsPc-react/react-ui/dist"
          rm: true
      
      - name: 上传后端JAR文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend-jar/ruoyi-admin.jar"
          target: "/opt/msds/msdsdocker/msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar"
      
      - name: 重启服务
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            
            echo "🚀 启动服务..."
            cd /opt/msds/msdsdocker
            
            # 检查docker-compose是否可用
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                echo "使用docker-compose启动所有服务..."
                sudo docker-compose -f docker-compose.prod.yml up -d
            elif sudo docker compose version &>/dev/null; then
                echo "使用docker compose启动所有服务..."
                sudo docker compose -f docker-compose.prod.yml up -d
            else
                echo "docker-compose不可用，使用docker启动单个容器..."
                # 启动基础服务（MySQL和Redis）
                sudo docker start msdsmysql msdsredis 2>/dev/null || echo "MySQL和Redis容器不存在"
                # 启动应用服务
                sudo docker start msdsbackend msdsnginx 2>/dev/null || echo "Backend和Nginx容器不存在"
            fi
            
            echo "⏳ 等待服务启动..."
            sleep 30
            
            echo "🧹 清理临时文件..."
            rm -rf /tmp/msds-deploy
            
            echo "📊 查看服务状态..."
            sudo docker ps | grep -E "msdsbackend|msdsnginx|msdsmysql|msdsredis"
            
            echo "✅ 部署完成！"
      
      - name: 健康检查
        run: |
          echo "⏳ 等待服务启动..."
          sleep 60
          
          echo "🏥 检查服务健康状态..."
          curl -f https://flymsds.cn/ || exit 1
          
          echo "✅ 健康检查通过！"
      
      - name: 发送部署通知
        if: always()
        run: |
          echo "📢 部署状态: ${{ job.status }}"
          echo "🔗 访问地址: https://flymsds.cn"

  # ==================== 部署到测试环境 ====================
  deploy-staging:
    name: 部署到测试环境
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      
      - name: 下载后端JAR文件
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar
      
      - name: 部署到测试服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 进入项目目录
            cd /opt/msds/msdsdocker
            
            # 检查docker-compose.prod.yml是否存在
            if [ ! -f docker-compose.prod.yml ]; then
                echo "❌ 错误：docker-compose.prod.yml文件不存在！"
                echo ""
                echo "=== 当前目录结构 ==="
                ls -la
                echo ""
                echo "=== 请先在服务器上初始化项目 ==="
                echo "1. 创建必要的目录结构"
                echo "2. 上传docker-compose.prod.yml文件"
                echo "3. 加载Docker镜像"
                exit 1
            fi
            
            # 诊断Docker环境
            echo "=== 诊断Docker环境 ==="
            echo "Docker版本："
            sudo docker --version 2>/dev/null || echo "Docker未安装"
            echo ""
            echo "Docker Compose版本："
            sudo docker-compose --version 2>/dev/null || sudo docker compose version 2>/dev/null || echo "Docker Compose未安装"
            echo ""
            echo "Docker服务状态："
            sudo systemctl status docker --no-pager | head -n 5
            echo ""
            echo "当前运行的容器："
            sudo docker ps
            echo ""
            echo "=== 诊断完成 ==="
            echo ""
            
            # 创建临时目录用于传输文件
            mkdir -p /tmp/msds-deploy-staging
            
            echo "📦 开始上传构建产物到测试环境..."
            
            # 备份当前版本
            if [ -d "msdsPC/ruoyi-MsdsPc-react/react-ui/dist" ]; then
              echo "💾 备份前端文件..."
              cp -r msdsPC/ruoyi-MsdsPc-react/react-ui/dist /tmp/msds-deploy-staging/frontend-backup || true
            fi
            
            if [ -f "msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar" ]; then
              echo "💾 备份后端JAR文件..."
              cp msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar /tmp/msds-deploy-staging/backend-backup.jar || true
            fi
            
            echo "📥 停止服务..."
            # 检查docker-compose是否可用
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                echo "使用docker-compose停止所有服务..."
                sudo docker-compose -f docker-compose.prod.yml stop
            elif sudo docker compose version &>/dev/null; then
                echo "使用docker compose停止所有服务..."
                sudo docker compose -f docker-compose.prod.yml stop
            else
                echo "docker-compose不可用，使用docker停止单个容器..."
                sudo docker stop msdsbackend msdsnginx msdsmysql msdsredis 2>/dev/null || echo "部分容器不存在"
            fi
            
            echo "⏳ 等待服务停止..."
            sleep 10
            
            echo "✅ 准备完成！"
      
      - name: 上传前端文件到测试服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-dist/*"
          target: "/opt/msds/msdsdocker/msdsPC/ruoyi-MsdsPc-react/react-ui/dist"
          rm: true
      
      - name: 上传后端JAR文件到测试服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend-jar/ruoyi-admin.jar"
          target: "/opt/msds/msdsdocker/msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar"
      
      - name: 重启测试服务
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            
            echo "🚀 启动测试服务..."
            cd /opt/msds/msdsdocker
            
            # 检查docker-compose是否可用
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                echo "使用docker-compose启动所有服务..."
                sudo docker-compose -f docker-compose.prod.yml up -d
            elif sudo docker compose version &>/dev/null; then
                echo "使用docker compose启动所有服务..."
                sudo docker compose -f docker-compose.prod.yml up -d
            else
                echo "docker-compose不可用，使用docker启动单个容器..."
                # 启动基础服务（MySQL和Redis）
                sudo docker start msdsmysql msdsredis 2>/dev/null || echo "MySQL和Redis容器不存在"
                # 启动应用服务
                sudo docker start msdsbackend msdsnginx 2>/dev/null || echo "Backend和Nginx容器不存在"
            fi
            
            echo "⏳ 等待服务启动..."
            sleep 30
            
            echo "🧹 清理临时文件..."
            rm -rf /tmp/msds-deploy-staging
            
            echo "📊 查看服务状态..."
            sudo docker ps | grep -E "msdsbackend|msdsnginx|msdsmysql|msdsredis"
            
            echo "✅ 测试环境部署完成！"
