name: MSDS系统CI/CD流水线

on:
  push:
    branches:
      - main      # 生产环境
      - develop   # 测试环境
  pull_request:
    branches:
      - main

env:
  # 服务器配置
  PRODUCTION_HOST: ${{ secrets.SSH_HOST }}
  PRODUCTION_USER: ${{ secrets.SSH_USER }}
  STAGING_HOST: ${{ secrets.SSH_HOST }}
  STAGING_USER: ${{ secrets.SSH_USER }}

jobs:
  # ==================== 前端构建 ====================
  build-frontend:
    name: 构建前端应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: msdsPC/ruoyi-MsdsPc-react/react-ui/package-lock.json
      
      - name: 配置npm国内镜像源
        run: |
          echo "🔨 配置npm国内镜像源..."
          npm config set registry https://registry.npmmirror.com
          echo "✅ npm镜像源配置完成"
          npm config get registry
      
      - name: 安装依赖
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm ci
      
      - name: 运行Lint检查
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run lint || true
      
      - name: 运行测试
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run test -- --passWithNoTests || true
      
      - name: 构建生产版本
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run build:prod
      
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: msdsPC/ruoyi-MsdsPc-react/react-ui/dist
          retention-days: 7

  # ==================== 后端构建 ====================
  build-backend:
    name: 构建后端应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: 配置Maven国内镜像源
        run: |
          echo "🔨 配置Maven国内镜像源..."
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <mirrorOf>central</mirrorOf>
                <name>Aliyun Maven Mirror</name>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          echo "✅ Maven镜像源配置完成"
      
      - name: Maven构建
        working-directory: msdsPC/ruoyi-MsdsPc-react
        run: mvn clean package -Pprod -DskipTests -B
      
      - name: 上传后端JAR文件
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar
          retention-days: 7

  # ==================== 构建Docker镜像 ====================
  build-docker-images:
    name: 构建Docker镜像
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3
      
      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 构建后端Docker镜像
        run: |
          echo "🔨 构建后端Docker镜像..."
          cd msdsPC/ruoyi-MsdsPc-react
          docker build -f Dockerfile.prod -t msdsbackend:latest .
          docker tag msdsbackend:latest msdsbackend
          echo "✅ 后端镜像构建完成"
      
      - name: 拉取并标记MySQL镜像
        run: |
          echo "🔨 拉取MySQL镜像..."
          # 优先使用本地镜像；若存在官方tag则直接重标记；都不存在才拉取
          if docker image inspect msdsmysql >/dev/null 2>&1; then
            echo "✅ 使用本地镜像: msdsmysql"
          elif docker image inspect mysql:8.0.42 >/dev/null 2>&1; then
            echo "✅ 使用本地镜像: mysql:8.0.42，正在重标记为 msdsmysql"
            docker tag mysql:8.0.42 msdsmysql
          else
            echo "本地镜像不存在，从Docker Hub拉取..."
            docker pull mysql:8.0.42
            docker tag mysql:8.0.42 msdsmysql
          fi
          echo "✅ MySQL镜像准备完成"
      
      - name: 拉取并标记Redis镜像
        run: |
          echo "🔨 拉取Redis镜像..."
          # 优先使用本地镜像；若存在官方tag则直接重标记；都不存在才拉取
          if docker image inspect msdsredis >/dev/null 2>&1; then
            echo "✅ 使用本地镜像: msdsredis"
          elif docker image inspect redis:latest >/dev/null 2>&1; then
            echo "✅ 使用本地镜像: redis:latest，正在重标记为 msdsredis"
            docker tag redis:latest msdsredis
          else
            echo "本地镜像不存在，从Docker Hub拉取..."
            docker pull redis:latest
            docker tag redis:latest msdsredis
          fi
          echo "✅ Redis镜像准备完成"
      
      - name: 构建Nginx前端镜像
        run: |
          echo "🔨 构建Nginx前端镜像..."
          cd msdsPC/ruoyi-MsdsPc-react/react-ui
          
          # 检查nginx.prod.conf是否存在
          if [ ! -f "nginx.prod.conf" ]; then
            echo "⚠️  nginx.prod.conf不存在，创建默认配置"
            cat > nginx.prod.conf << 'EOF'
          server {
              listen 80;
              server_name localhost;
              
              root /usr/share/nginx/html;
              index index.html index.htm;
              
              location / {
                  try_files $uri $uri/ /index.html;
              }
              
              location /prod-api/ {
                  proxy_pass http://msdsbackend:8080/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF
          fi
          
          docker build -f Dockerfile.nginx -t msdsnginx:latest .
          docker tag msdsnginx:latest msdsnginx
          echo "✅ Nginx镜像构建完成"
      
      - name: 导出Docker镜像
        run: |
          echo "📦 导出Docker镜像为tar文件..."
          mkdir -p docker-images
          
          # 导出MySQL镜像
          docker save msdsmysql -o docker-images/msdsmysql.tar
          echo "✅ msdsmysql.tar 导出完成"
          
          # 导出Redis镜像
          docker save msdsredis -o docker-images/msdsredis.tar
          echo "✅ msdsredis.tar 导出完成"
          
          # 导出后端镜像
          docker save msdsbackend:latest -o docker-images/msdsbackend.tar
          echo "✅ msdsbackend.tar 导出完成"
          
          # 导出Nginx镜像
          docker save msdsnginx:latest -o docker-images/msdsnginx.tar
          echo "✅ msdsnginx.tar 导出完成"
          
          ls -lh docker-images/
      
      - name: 上传Docker镜像
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images/*.tar
          retention-days: 7

  # ==================== 上传Docker配置文件 ====================
  upload-docker-config:
    name: 上传Docker配置文件
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 创建服务器目录
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 创建服务器目录结构 ==="
            cd /opt/msds
            mkdir -p msdsdocker
            mkdir -p aboutproject/msdsdatabases
            cd msdsdocker
            mkdir -p backend
            mkdir -p images
            mkdir -p nginx/conf.d nginx/ssl nginx/logs nginx/html
            mkdir -p mysql/conf.d
            mkdir -p msdsfullstatckcompose/msdsdatabaseinitdb
            if [ -d nginx/conf.d/default.conf ]; then
              echo "⚠️  nginx/conf.d/default.conf 是目录，清理后重新上传"
              rm -rf nginx/conf.d/default.conf
            fi
            echo "✅ 目录结构创建完成"
            ls -la
      
      - name: 检查docker-compose.prod.yml文件
        run: |
          echo "=== 检查docker-compose.prod.yml文件 ==="
          if [ -f "msdsdocker/docker-compose.prod.yml" ]; then
            echo "✅ docker-compose.prod.yml文件存在"
            ls -lh msdsdocker/docker-compose.prod.yml
          else
            echo "❌ docker-compose.prod.yml文件不存在"
            echo "当前目录："
            pwd
            echo "当前目录内容："
            ls -la
            echo "msdsdocker目录内容："
            ls -la msdsdocker/ || echo "msdsdocker目录不存在"
            exit 1
          fi
      
      - name: 上传docker-compose.prod.yml到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "msdsdocker/docker-compose.prod.yml"
          target: "/opt/msds/msdsdocker/"
          rm: false
          strip_components: 1

      - name: 上传Nginx配置到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "msdsdocker/nginx/conf.d/default.conf"
          target: "/opt/msds/msdsdocker/nginx/conf.d/"
          rm: false
          strip_components: 3

      - name: 校验Nginx默认配置存在
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            if [ ! -f nginx/conf.d/default.conf ]; then
              echo "❌ nginx/conf.d/default.conf 不存在，无法启动Nginx"
              exit 1
            fi
            if [ -d nginx/conf.d/default.conf ]; then
              echo "❌ nginx/conf.d/default.conf 是目录，必须为文件"
              exit 1
            fi

      - name: 上传数据库SQL到服务器（用于MySQL首次初始化）
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "aboutproject/msdsdatabases/msds_complete_database.sql"
          target: "/opt/msds/aboutproject/msdsdatabases/"
          rm: false
          strip_components: 2
      
      - name: 验证文件上传
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 验证文件上传 ==="
            cd /opt/msds/msdsdocker
            if [ -f docker-compose.prod.yml ]; then
              echo "✅ docker-compose.prod.yml已成功上传"
              ls -lh docker-compose.prod.yml
            else
              echo "❌ docker-compose.prod.yml上传失败"
              echo "当前目录内容："
              ls -la
              exit 1
            fi


            if [ -f /opt/msds/aboutproject/msdsdatabases/msds_complete_database.sql ]; then
              echo "✅ msds_complete_database.sql已上传（用于首次初始化）"
              ls -lh /opt/msds/aboutproject/msdsdatabases/msds_complete_database.sql
            else
              echo "⚠️  未发现 msds_complete_database.sql（MySQL 可能无法完成初始化）"
            fi

  # ==================== 部署到生产环境 ====================
  deploy-production:
    name: 部署到生产环境
    needs: [build-frontend, build-backend, upload-docker-config]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://flymsds.cn
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      
      - name: 下载后端JAR文件
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar
      
      - name: 下载Docker镜像
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images
      
      - name: 上传Docker镜像到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-images/*.tar"
          target: "/opt/msds/msdsdocker/images/"
          strip_components: 1
          rm: false
      
      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 进入项目目录
            cd /opt/msds/msdsdocker
            
            # 检查docker-compose.prod.yml是否存在
            if [ ! -f docker-compose.prod.yml ]; then
                echo "❌ 错误：docker-compose.prod.yml文件不存在！"
                echo ""
                echo "=== 当前目录结构 ==="
                ls -la
                echo ""
                echo "=== 请先在服务器上初始化项目 ==="
                echo "1. 创建必要的目录结构"
                echo "2. 上传docker-compose.prod.yml文件"
                echo "3. 加载Docker镜像"
                exit 1
            fi
            
            # 诊断Docker环境
            echo "=== 诊断Docker环境 ==="
            echo "Docker版本："
            sudo docker --version 2>/dev/null || echo "Docker未安装"
            echo ""
            echo "Docker Compose版本："
            sudo docker-compose --version 2>/dev/null || sudo docker compose version 2>/dev/null || echo "Docker Compose未安装"
            echo ""
            echo "Docker服务状态："
            sudo systemctl status docker --no-pager | head -n 5
            echo ""
            echo "当前运行的容器："
            sudo docker ps
            echo ""
            echo "=== 诊断完成 ==="
            echo ""
            
            # 加载Docker镜像
            echo "📦 加载Docker镜像..."
            if [ -d "images" ]; then
                echo "查找并加载 images 目录下的 *.tar（兼容 images/ 与 images/docker-images/）"
                found_tar=0
                while IFS= read -r -d '' tar_path; do
                    found_tar=1
                    echo "加载镜像: $tar_path"
                    sudo docker load -i "$tar_path"
                done < <(find images -maxdepth 2 -type f -name "*.tar" -print0)

                if [ "$found_tar" -eq 0 ]; then
                    echo "⚠️  images 下未找到任何 tar 文件，跳过镜像加载"
                else
                    echo "✅ Docker镜像加载完成"
                    echo ""
                    echo "=== 已加载的Docker镜像 ==="
                    sudo docker images | grep -E "msdsnginx|msdsbackend|msdsmysql|msdsredis" || true
                    echo ""
                fi
            else
                echo "⚠️  未找到images目录，跳过镜像加载"
            fi
            
            # 创建临时目录用于传输文件
            mkdir -p /tmp/msds-deploy
            
            echo "📦 开始上传构建产物..."
            
            # 备份当前版本
            if [ -d "msdsPC/ruoyi-MsdsPc-react/react-ui/dist" ]; then
              echo "💾 备份前端文件..."
              cp -r msdsPC/ruoyi-MsdsPc-react/react-ui/dist /tmp/msds-deploy/frontend-backup || true
            fi
            
            if [ -f "msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar" ]; then
              echo "💾 备份后端JAR文件..."
              cp msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar /tmp/msds-deploy/backend-backup.jar || true
            fi
            
            # 备份数据库
            echo "💾 备份数据库..."
            sudo docker exec msdsmysql mysqldump -u root -proot_password msds_dev > /tmp/msds-deploy/database-backup.sql || echo "⚠️  数据库备份失败，继续部署"
            
            echo "📥 停止服务..."
            # 检查docker-compose是否可用
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                echo "使用docker-compose停止所有服务..."
                sudo docker-compose -f docker-compose.prod.yml stop
            elif sudo docker compose version &>/dev/null; then
                echo "使用docker compose停止所有服务..."
                sudo docker compose -f docker-compose.prod.yml stop
            else
                echo "docker-compose不可用，使用docker停止单个容器..."
                sudo docker stop msdsbackend msdsnginx msdsmysql msdsredis 2>/dev/null || echo "部分容器不存在"
            fi
            
            echo "⏳ 等待服务停止..."
            sleep 10
            
            echo "✅ 部署完成！"
      
      - name: 上传前端文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-dist/."
          target: "/opt/msds/msdsdocker/nginx/html/frontend-dist"
          rm: true

      - name: 扁平化前端静态资源到Nginx根目录
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            if [ ! -d nginx/html/frontend-dist ]; then
              echo "❌ nginx/html/frontend-dist 目录不存在，无法扁平化"
              exit 1
            fi
            sudo find nginx/html -mindepth 1 -maxdepth 1 ! -name frontend-dist -exec rm -rf {} +
            sudo cp -a nginx/html/frontend-dist/. nginx/html/
            sudo rm -rf nginx/html/frontend-dist

      - name: 校验前端静态资源与权限
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            echo "=== 检查静态资源目录 ==="
            ls -la nginx/html | head -n 20
            if [ ! -f nginx/html/index.html ]; then
              echo "❌ 缺少 index.html，Nginx 可能返回 403"
              exit 1
            fi
            if [ -d nginx/html/frontend-dist ]; then
              echo "❌ 静态目录仍存在 frontend-dist 子目录，路径未扁平化"
              exit 1
            fi
            echo "=== 修复静态资源权限 ==="
            sudo chmod -R 755 nginx/html
            sudo find nginx/html -type f -exec chmod 644 {} \;
      
      - name: 上传后端JAR文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend-jar/*.jar"
          target: "/opt/msds/msdsdocker/backend/"
      
      - name: 重启服务
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker

            echo "🚀 启动服务..."
            cd /opt/msds/msdsdocker

            echo "=== 检查SSL证书 ==="
            if [ -d nginx/ssl ]; then
              ls -la nginx/ssl
            else
              echo "⚠️  nginx/ssl 目录不存在，HTTPS 将不可用"
            fi

            compose_cmd=""
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
              compose_cmd="sudo docker-compose -f docker-compose.prod.yml"
            elif sudo docker compose version &>/dev/null; then
              compose_cmd="sudo docker compose -f docker-compose.prod.yml"
            fi

            echo "▶️  启动基础服务（MySQL/Redis）..."
            if [ -n "$compose_cmd" ]; then
              $compose_cmd up -d msdsmysql msdsredis --remove-orphans || true
            else
              sudo docker start msdsmysql msdsredis 2>/dev/null || true
            fi

            echo "🗄️  等待 MySQL 就绪..."
            for i in $(seq 1 60); do
              if sudo docker exec msdsmysql mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent; then
                echo "✅ MySQL 已就绪"
                break
              fi
              sleep 2
            done

            if ! sudo docker exec msdsmysql mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent; then
              echo "❌ MySQL 未就绪，输出 MySQL 日志"
              sudo docker logs --tail=300 msdsmysql || true
              exit 1
            fi

            echo "🗄️  校验并初始化 msds_dev 数据库（如需要）..."
            sudo docker exec msdsmysql sh -c "mysql -u root -proot_password -e \"CREATE DATABASE IF NOT EXISTS msds_dev DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\""
            sudo docker exec msdsmysql sh -c "mysql -u root -proot_password -e \"CREATE USER IF NOT EXISTS 'msds_user'@'%' IDENTIFIED BY 'msds_dev_password'; GRANT ALL PRIVILEGES ON msds_dev.* TO 'msds_user'@'%'; FLUSH PRIVILEGES;\""

            has_sys_menu=$(sudo docker exec msdsmysql sh -c "mysql -N -s -u root -proot_password -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='msds_dev' AND table_name='sys_menu';\"")
            table_count=$(sudo docker exec msdsmysql sh -c "mysql -N -s -u root -proot_password -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='msds_dev';\"")
            echo "msds_dev 表数量: ${table_count}, sys_menu: ${has_sys_menu}"

            if [ "${has_sys_menu}" = "0" ] && [ "${table_count}" -le 1 ]; then
              if sudo docker exec msdsmysql test -f /docker-entrypoint-initdb.d/00-msds_complete_database.sql; then
                echo "📥 发现 00-msds_complete_database.sql，开始导入..."
                sudo docker exec msdsmysql sh -c "mysql -u root -proot_password < /docker-entrypoint-initdb.d/00-msds_complete_database.sql"
                echo "✅ 导入完成"
              else
                echo "❌ 未找到初始化 SQL（/docker-entrypoint-initdb.d/00-msds_complete_database.sql），无法初始化"
                exit 1
              fi
            elif [ "${has_sys_menu}" = "0" ] && [ "${table_count}" != "0" ]; then
              echo "❌ msds_dev 已存在部分表，但缺少 sys_menu（RuoYi 系统表未初始化）。"
              echo "   为避免覆盖现有数据，流水线不会自动导入完整脚本。"
              echo "   处理方式：清空 MySQL 数据卷后重新启动，或手工补齐缺失系统表。"
              exit 1
            else
              echo "✅ 数据库结构已满足后端启动条件"
            fi

            echo "▶️  启动后端服务..."
            if [ -n "$compose_cmd" ]; then
              $compose_cmd up -d msdsbackend || true
            else
              sudo docker start msdsbackend 2>/dev/null || true
            fi

            echo "🏥 等待后端健康..."
            backend_ok=0
            for i in $(seq 1 60); do
              if sudo docker exec msdsbackend sh -c "curl -fsS http://127.0.0.1:8080/ >/dev/null"; then
                backend_ok=1
                echo "✅ 后端已健康"
                break
              fi
              sleep 5
            done

            if [ "$backend_ok" -ne 1 ]; then
              echo "❌ 后端未就绪，输出后端日志"
              sudo docker logs --tail=300 msdsbackend || true
              exit 1
            fi

            echo "▶️  启动 Nginx..."
            if [ -n "$compose_cmd" ]; then
              $compose_cmd up -d msdsnginx || true
            else
              sudo docker start msdsnginx 2>/dev/null || true
            fi
            
            echo "🧹 清理临时文件..."
            rm -rf /tmp/msds-deploy
            
            echo "📊 查看服务状态..."
            sudo docker ps -a | grep -E "msdsbackend|msdsnginx|msdsmysql|msdsredis" || true

            expected_containers=$(sudo docker ps -a --format '{{.Names}}' | grep -E '^(msdsbackend|msdsnginx|msdsmysql|msdsredis)$' | wc -l)
            if [ "$expected_containers" -lt 4 ]; then
              echo "❌ 容器未按预期创建/启动，输出compose配置与日志用于诊断"
              if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                sudo docker-compose -f docker-compose.prod.yml ps || true
                sudo docker-compose -f docker-compose.prod.yml logs --tail=200 || true
              elif sudo docker compose version &>/dev/null; then
                sudo docker compose -f docker-compose.prod.yml ps || true
                sudo docker compose -f docker-compose.prod.yml logs --tail=200 || true
              fi
              exit 1
            fi
            
            echo "✅ 部署完成！"

      - name: 校验Nginx本地健康与静态文件
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Nginx 容器内健康检查 ==="
            sudo docker exec msdsnginx sh -c "nginx -t"
            sudo docker exec msdsnginx sh -c "wget -qO- http://127.0.0.1/health"
            echo "=== Nginx 静态文件目录 ==="
            sudo docker exec msdsnginx sh -c "ls -la /usr/share/nginx/html | head -n 20"
            sudo docker exec msdsnginx sh -c "test -f /usr/share/nginx/html/index.html"

      - name: 校验服务器本机端口访问
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 服务器本机访问 80 端口 ==="
            curl -fsS http://127.0.0.1/health >/dev/null
            curl -fsS http://127.0.0.1/ | head -n 5
            echo "=== 服务器本机访问 443 端口（忽略证书）==="
            curl -kfsS https://127.0.0.1/health >/dev/null || true
      
      - name: 健康检查
        id: healthcheck
        continue-on-error: true
        run: |
          set -e
          echo "⏳ 等待服务启动..."
          sleep 30

          echo "🏥 检查服务健康状态..."
          for i in $(seq 1 18); do
            echo "尝试 $i/18: /health + /prod-api/"
            if curl -fsS http://flymsds.cn/health >/dev/null && curl -fsS http://flymsds.cn/prod-api/ >/dev/null; then
              echo "✅ 健康检查通过！"
              exit 0
            fi
            sleep 10
          done

          echo "❌ 健康检查失败"
          exit 1

      - name: 健康检查失败时输出服务器日志
        if: steps.healthcheck.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            echo "=== docker ps -a ==="
            sudo docker ps -a | grep -E "msdsbackend|msdsnginx|msdsmysql|msdsredis" || true

            echo "=== docker inspect (status) ==="
            for c in msdsmysql msdsredis msdsbackend msdsnginx; do
              echo "-- $c --"
              sudo docker inspect -f '{{.Name}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$c" 2>/dev/null || true
            done

            echo "=== backend root (container local) ==="
            sudo docker exec msdsbackend sh -c "curl -i -sS http://127.0.0.1:8080/ | head -n 20" || true

            echo "=== compose ps ==="
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
              sudo docker-compose -f docker-compose.prod.yml ps || true
            elif sudo docker compose version &>/dev/null; then
              sudo docker compose -f docker-compose.prod.yml ps || true
            fi

            echo "=== backend logs (tail 300) ==="
            sudo docker logs --tail=300 msdsbackend || true

            echo "=== nginx logs (tail 200) ==="
            sudo docker logs --tail=200 msdsnginx || true

      - name: 健康检查失败则终止部署
        if: steps.healthcheck.outcome == 'failure'
        run: exit 1
      
      - name: 发送部署通知
        if: always()
        run: |
          echo "📢 部署状态: ${{ job.status }}"
          echo "🔗 访问地址: https://flymsds.cn"

  # ==================== 部署到测试环境 ====================
  deploy-staging:
    name: 部署到测试环境
    needs: [build-frontend, build-backend, upload-docker-config]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      
      - name: 下载后端JAR文件
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar
      
      - name: 下载Docker镜像
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images
      
      - name: 上传Docker镜像到测试服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-images/*.tar"
          target: "/opt/msds/msdsdocker/images/"
          strip_components: 1
          rm: false
      
      - name: 部署到测试服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 进入项目目录
            cd /opt/msds/msdsdocker
            
            # 检查docker-compose.prod.yml是否存在
            if [ ! -f docker-compose.prod.yml ]; then
                echo "❌ 错误：docker-compose.prod.yml文件不存在！"
                echo ""
                echo "=== 当前目录结构 ==="
                ls -la
                echo ""
                echo "=== 请先在服务器上初始化项目 ==="
                echo "1. 创建必要的目录结构"
                echo "2. 上传docker-compose.prod.yml文件"
                echo "3. 加载Docker镜像"
                exit 1
            fi
            
            # 诊断Docker环境
            echo "=== 诊断Docker环境 ==="
            echo "Docker版本："
            sudo docker --version 2>/dev/null || echo "Docker未安装"
            echo ""
            echo "Docker Compose版本："
            sudo docker-compose --version 2>/dev/null || sudo docker compose version 2>/dev/null || echo "Docker Compose未安装"
            echo ""
            echo "Docker服务状态："
            sudo systemctl status docker --no-pager | head -n 5
            echo ""
            echo "当前运行的容器："
            sudo docker ps
            echo ""
            echo "=== 诊断完成 ==="
            echo ""
            
            # 加载Docker镜像
            echo "📦 加载Docker镜像..."
            if [ -d "images" ]; then
                echo "查找并加载 images 目录下的 *.tar（兼容 images/ 与 images/docker-images/）"
                found_tar=0
                while IFS= read -r -d '' tar_path; do
                    found_tar=1
                    echo "加载镜像: $tar_path"
                    sudo docker load -i "$tar_path"
                done < <(find images -maxdepth 2 -type f -name "*.tar" -print0)

                if [ "$found_tar" -eq 0 ]; then
                    echo "⚠️  images 下未找到任何 tar 文件，跳过镜像加载"
                else
                    echo "✅ Docker镜像加载完成"
                    echo ""
                    echo "=== 已加载的Docker镜像 ==="
                    sudo docker images | grep -E "msdsnginx|msdsbackend|msdsmysql|msdsredis" || true
                    echo ""
                fi
            else
                echo "⚠️  未找到images目录，跳过镜像加载"
            fi
            
            # 创建临时目录用于传输文件
            mkdir -p /tmp/msds-deploy-staging
            
            echo "📦 开始上传构建产物到测试环境..."
            
            # 备份当前版本
            if [ -d "msdsPC/ruoyi-MsdsPc-react/react-ui/dist" ]; then
              echo "💾 备份前端文件..."
              cp -r msdsPC/ruoyi-MsdsPc-react/react-ui/dist /tmp/msds-deploy-staging/frontend-backup || true
            fi
            
            if [ -f "msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar" ]; then
              echo "💾 备份后端JAR文件..."
              cp msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar /tmp/msds-deploy-staging/backend-backup.jar || true
            fi
            
            echo "📥 停止服务..."
            # 检查docker-compose是否可用
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                echo "使用docker-compose停止所有服务..."
                sudo docker-compose -f docker-compose.prod.yml stop
            elif sudo docker compose version &>/dev/null; then
                echo "使用docker compose停止所有服务..."
                sudo docker compose -f docker-compose.prod.yml stop
            else
                echo "docker-compose不可用，使用docker停止单个容器..."
                sudo docker stop msdsbackend msdsnginx msdsmysql msdsredis 2>/dev/null || echo "部分容器不存在"
            fi
            
            echo "⏳ 等待服务停止..."
            sleep 10
            
            echo "✅ 准备完成！"
      
      - name: 上传前端文件到测试服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-dist/*"
          target: "/opt/msds/msdsdocker/nginx/html"
          rm: true
      
      - name: 上传后端JAR文件到测试服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend-jar/*.jar"
          target: "/opt/msds/msdsdocker/backend/"
      
      - name: 重启测试服务
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/msds/msdsdocker

            echo "🚀 启动测试服务..."
            cd /opt/msds/msdsdocker

            compose_cmd=""
            if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
              compose_cmd="sudo docker-compose -f docker-compose.prod.yml"
            elif sudo docker compose version &>/dev/null; then
              compose_cmd="sudo docker compose -f docker-compose.prod.yml"
            fi

            echo "▶️  启动基础服务（MySQL/Redis）..."
            if [ -n "$compose_cmd" ]; then
              $compose_cmd up -d msdsmysql msdsredis --remove-orphans || true
            else
              sudo docker start msdsmysql msdsredis 2>/dev/null || true
            fi

            echo "⏳ 等待服务启动..."
            sleep 10

            echo "🗄️  等待 MySQL 就绪..."
            for i in $(seq 1 60); do
              if sudo docker exec msdsmysql mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent; then
                echo "✅ MySQL 已就绪"
                break
              fi
              sleep 2
            done

            if ! sudo docker exec msdsmysql mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent; then
              echo "❌ MySQL 未就绪，输出 MySQL 日志"
              sudo docker logs --tail=300 msdsmysql || true
              exit 1
            fi

            echo "🗄️  校验并初始化 msds_dev 数据库（如需要）..."
            sudo docker exec msdsmysql sh -c "mysql -u root -proot_password -e \"CREATE DATABASE IF NOT EXISTS msds_dev DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\""
            sudo docker exec msdsmysql sh -c "mysql -u root -proot_password -e \"CREATE USER IF NOT EXISTS 'msds_user'@'%' IDENTIFIED BY 'msds_dev_password'; GRANT ALL PRIVILEGES ON msds_dev.* TO 'msds_user'@'%'; FLUSH PRIVILEGES;\""

            has_sys_menu=$(sudo docker exec msdsmysql sh -c "mysql -N -s -u root -proot_password -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='msds_dev' AND table_name='sys_menu';\"")
            table_count=$(sudo docker exec msdsmysql sh -c "mysql -N -s -u root -proot_password -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='msds_dev';\"")
            echo "msds_dev 表数量: ${table_count}, sys_menu: ${has_sys_menu}"

            if [ "${has_sys_menu}" = "0" ] && [ "${table_count}" -le 1 ]; then
              if sudo docker exec msdsmysql test -f /docker-entrypoint-initdb.d/00-msds_complete_database.sql; then
                echo "📥 发现 00-msds_complete_database.sql，开始导入..."
                sudo docker exec msdsmysql sh -c "mysql -u root -proot_password < /docker-entrypoint-initdb.d/00-msds_complete_database.sql"
                echo "✅ 导入完成"
              else
                echo "❌ 未找到初始化 SQL（/docker-entrypoint-initdb.d/00-msds_complete_database.sql），无法初始化"
                exit 1
              fi
            elif [ "${has_sys_menu}" = "0" ] && [ "${table_count}" != "0" ]; then
              echo "❌ msds_dev 已存在部分表，但缺少 sys_menu（RuoYi 系统表未初始化）。"
              echo "   为避免覆盖现有数据，流水线不会自动导入完整脚本。"
              echo "   处理方式：清空 MySQL 数据卷后重新启动，或手工补齐缺失系统表。"
              exit 1
            else
              echo "✅ 数据库结构已满足后端启动条件"
            fi

            echo "▶️  启动后端服务..."
            if [ -n "$compose_cmd" ]; then
              $compose_cmd up -d msdsbackend || true
            else
              sudo docker start msdsbackend 2>/dev/null || true
            fi

            echo "🏥 等待后端健康..."
            backend_ok=0
            for i in $(seq 1 60); do
              if sudo docker exec msdsbackend sh -c "curl -fsS http://127.0.0.1:8080/ >/dev/null"; then
                backend_ok=1
                echo "✅ 后端已健康"
                break
              fi
              sleep 5
            done

            if [ "$backend_ok" -ne 1 ]; then
              echo "❌ 后端未就绪，输出后端日志"
              sudo docker logs --tail=300 msdsbackend || true
              exit 1
            fi

            echo "▶️  启动 Nginx..."
            if [ -n "$compose_cmd" ]; then
              $compose_cmd up -d msdsnginx || true
            else
              sudo docker start msdsnginx 2>/dev/null || true
            fi
            
            echo "🧹 清理临时文件..."
            rm -rf /tmp/msds-deploy-staging
            
            echo "📊 查看服务状态..."
            sudo docker ps -a | grep -E "msdsbackend|msdsnginx|msdsmysql|msdsredis" || true

            expected_containers=$(sudo docker ps -a --format '{{.Names}}' | grep -E '^(msdsbackend|msdsnginx|msdsmysql|msdsredis)$' | wc -l)
            if [ "$expected_containers" -lt 4 ]; then
              echo "❌ 测试环境容器未按预期创建/启动，输出compose配置与日志用于诊断"
              if sudo docker-compose -f docker-compose.prod.yml version &>/dev/null; then
                sudo docker-compose -f docker-compose.prod.yml ps || true
                sudo docker-compose -f docker-compose.prod.yml logs --tail=200 || true
              elif sudo docker compose version &>/dev/null; then
                sudo docker compose -f docker-compose.prod.yml ps || true
                sudo docker compose -f docker-compose.prod.yml logs --tail=200 || true
              fi
              exit 1
            fi
            
            echo "✅ 测试环境部署完成！"
