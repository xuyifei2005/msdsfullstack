name: MSDS系统CI/CD流水线

on:
  push:
    branches:
      - main      # 生产环境
      - develop   # 测试环境
  pull_request:
    branches:
      - main

env:
  # 阿里云容器镜像仓库配置
  REGISTRY: registry.cn-beijing.aliyuncs.com
  NAMESPACE: jfkjmsds  # 修改为实际创建的命名空间
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend

jobs:
  # ==================== 前端构建 ====================
  build-frontend:
    name: 构建前端应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: msdsPC/ruoyi-MsdsPc-react/react-ui/package-lock.json
      
      - name: 安装依赖
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm ci
      
      - name: 运行Lint检查
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run lint || true
      
      - name: 运行测试
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run test -- --passWithNoTests || true
      
      - name: 构建生产版本
        working-directory: msdsPC/ruoyi-MsdsPc-react/react-ui
        run: npm run build:prod
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: msdsPC/ruoyi-MsdsPc-react/react-ui/dist
          retention-days: 7

  # ==================== 后端构建 ====================
  build-backend:
    name: 构建后端应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Maven构建
        working-directory: msdsPC/ruoyi-MsdsPc-react
        run: mvn clean package -Pprod -DskipTests -B
      
      - name: 上传JAR文件
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target/ruoyi-admin.jar
          retention-days: 7

  # ==================== 构建Docker镜像 ====================
  build-docker:
    name: 构建并推送Docker镜像
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: msdsPC/ruoyi-MsdsPc-react/react-ui/dist
      
      - name: 下载后端JAR文件
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: msdsPC/ruoyi-MsdsPc-react/ruoyi-admin/target
      
      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      
      - name: 提取元数据（标签、注释）
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
      
      - name: 提取前端元数据
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
      
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: msdsPC/ruoyi-MsdsPc-react
          file: msdsPC/ruoyi-MsdsPc-react/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: msdsPC/ruoyi-MsdsPc-react/react-ui
          file: msdsPC/ruoyi-MsdsPc-react/react-ui/Dockerfile.nginx
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到生产环境 ====================
  deploy-production:
    name: 部署到生产环境
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://flymsds.cn
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 删除pdf2xml目录（避免长文件名问题）
        run: rm -rf pdf2xml || true
      
      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/msds/msdsdocker
            
            echo "📦 拉取最新镜像..."
            docker-compose -f docker-compose.prod.yml pull msdsbackend msdsnginx
            
            echo "💾 备份数据库..."
            ./backup-restore.sh full || echo "⚠️  备份失败，继续部署"
            
            echo "🔄 重新部署服务..."
            docker-compose -f docker-compose.prod.yml up -d msdsbackend msdsnginx
            
            echo "🧹 清理旧镜像..."
            docker image prune -f
            
            echo "✅ 部署完成！"
      
      - name: 健康检查
        run: |
          echo "⏳ 等待服务启动..."
          sleep 60
          
          echo "🏥 检查服务健康状态..."
          curl -f https://flymsds.cn/health || exit 1
          
          echo "✅ 健康检查通过！"
      
      - name: 发送部署通知（可选）
        if: always()
        run: |
          echo "📢 部署状态: ${{ job.status }}"
          echo "🔗 访问地址: https://flymsds.cn"

  # ==================== 部署到测试环境 ====================
  deploy-staging:
    name: 部署到测试环境
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    
    steps:
      - name: 部署到测试服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/msds-staging
            docker-compose pull
            docker-compose up -d
